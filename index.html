const TIER = {
  exceeds: {label:'Regulator-level concern', cls:'red', dot:'d-red',
    blurb:'A health guidance value is exceeded in real diets, a regulator has withdrawn or failed to set a safe intake, or there is a documented reaction risk. The strongest tier — and note how few things are in it.'},
  unsettled:{label:'Genuinely unsettled', cls:'amber', dot:'d-amber',
    blurb:'There is a real, published signal — a cohort association, a mechanistic finding, a temporary or contested safety opinion — that has not been resolved either way. Not proof of harm. Not the all-clear either.'},
  context:  {label:'Worth knowing', cls:'yellow', dot:'d-yellow',
    blurb:'No meaningful safety question at normal intakes, but something about it is worth knowing: animal origin, a labelling warning, a legal loophole, or what its presence tells you about the product.'},
  settled:  {label:'Settled at normal intake', cls:'grey', dot:'d-grey',
    blurb:'Evaluated, unremarkable, and not worth your attention. Most of the long list on a label lives here — which is the point.'}
};
const TIER_ORDER = ['exceeds','unsettled','context','settled'];

/* ============================================================
   TEXT NORMALISATION + MATCHING
   ============================================================ */
function norm(s){
  return (s||'')
    .toLowerCase()
    .replace(/[‘’ʼ]/g,"'")
    .replace(/[“”]/g,'"')
    .replace(/[‐-―−]/g,'-')
    .replace(/ /g,' ')
    .replace(/\bins\s*(\d{3,4})/g,'e$1')                          // INS 466 -> e466
    .replace(/\be[\s.\-]?(\d{3,4})\s*\((ii?i?|iv|vi?i?i?|[a-z])\)/g,'e$1$2') // E450(i) / E 472 (b) -> e450i
    .replace(/\be[\s.\-](\d{3,4})/g,'e$1')                        // E-466 / E 466 -> e466
    .replace(/[^a-z0-9'\-\s%.,()\/]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

// build a lookup of every alias -> entry
const ALIAS = [];
DB.forEach(function(a){
  const seen = new Set();
  const push = function(t){
    t = norm(t);
    if(t.length < 3 || seen.has(t)) return;
    seen.add(t);
    ALIAS.push({t:t, e:a, isCode:/^e\d{3}[a-z]{0,2}$/.test(t)});
  };
  if(a.code && a.code !== '—') push(a.code);
  (a.aka||[]).forEach(push);
  push(a.name.replace(/\s*\(.*?\)\s*/g,' '));
});
// longest aliases first, so "carboxymethyl cellulose" wins over "cellulose"
ALIAS.sort(function(x,y){return y.t.length - x.t.length;});

function hasPhrase(hay, needle){
  let i = 0;
  while((i = hay.indexOf(needle, i)) !== -1){
    const before = i === 0 ? ' ' : hay[i-1];
    const after  = i + needle.length >= hay.length ? ' ' : hay[i + needle.length];
    if(!/[a-z0-9]/.test(before) && !/[a-z0-9]/.test(after)) return i;
    i += needle.length;
  }
  return -1;
}

const E_RE = /\be(\d{3,4})([a-z]{0,3})\b/g;

// exact code -> entry, for the sub-code fallback below
const CODE_INDEX = {};
ALIAS.forEach(function(al){ if(al.isCode && !CODE_INDEX[al.t]) CODE_INDEX[al.t] = al.e; });

// E450(i), E160ai, E331iii and friends: labels and databases use sub-codes that
// no UK ingredient list spells out in full. Try the exact code, then progressively
// drop the trailing letters until something matches — E160ai -> E160a -> E160.
function resolveCode(code){
  let c = code;
  while(c.length > 2){
    if(CODE_INDEX[c]) return CODE_INDEX[c];
    if(!/[a-z]$/.test(c)) break;
    c = c.slice(0, -1);
  }
  return null;
}

function analyse(rawText){
  const text = norm(rawText);
  const found = [];
  const hitAt = [];       // [start,end] spans already claimed
  const seenEntries = new Set();

  function claimed(s,e){
    return hitAt.some(function(r){return s < r[1] && e > r[0];});
  }

  ALIAS.forEach(function(al){
    if(seenEntries.has(al.e.name)) return;
    const i = hasPhrase(text, al.t);
    if(i === -1) return;
    if(claimed(i, i + al.t.length)) return;
    hitAt.push([i, i + al.t.length]);
    seenEntries.add(al.e.name);
    found.push({entry: al.e, matched: al.t, pos: i});
  });

  // Any remaining E-numbers: resolve sub-codes to their parent entry where we can,
  // and report the rest honestly rather than pretending they were checked.
  const unknown = [];
  let m;
  E_RE.lastIndex = 0;
  while((m = E_RE.exec(text)) !== null){
    const raw = m[1] + (m[2]||'');
    if(claimed(m.index, m.index + m[0].length)) continue;
    const entry = resolveCode('e' + raw);
    if(entry){
      if(!seenEntries.has(entry.name)){
        seenEntries.add(entry.name);
        hitAt.push([m.index, m.index + m[0].length]);
        found.push({entry: entry, matched: 'e' + raw, pos: m.index});
      }
      continue;
    }
    const code = 'E' + raw.toUpperCase();
    if(unknown.indexOf(code) === -1) unknown.push(code);
  }

  // Text with every additive/ingredient match blanked out. Used for the crop and
  // animal-ingredient sweeps so that, e.g., "paprika extract" (a colour we have
  // already explained) does not also register as the spice crop, and "gelatine"
  // is not listed twice.
  let masked = text;
  hitAt.forEach(function(r){
    masked = masked.slice(0, r[0]) + ' '.repeat(r[1] - r[0]) + masked.slice(r[1]);
  });

  // ultra-processing markers (run on the full text — class words like
  // "emulsifier" are never claimed by an alias, and overlap here is meaningful)
  const markers = [];
  CTX.markers.forEach(function(mk){
    for(const a of mk.aka){
      if(hasPhrase(text, norm(a)) !== -1){ markers.push(mk); return; }
    }
  });

  // animal-derived ingredients (not additives)
  const animal = [];
  CTX.veganRedFlags.forEach(function(v){
    for(const a of v.aka){
      const n = norm(a);
      if(hasPhrase(masked, n) !== -1){
        // avoid "milk" matching "oat milk" / "coconut milk" / "milk-free"
        if(['milk','butter','egg','honey'].indexOf(n) !== -1){
          const re = new RegExp('(oat|soya|soy|almond|coconut|rice|hazelnut|cashew|plant|nut|hemp|pea|free[ -]from|vegan|non[ -]dairy|shea|cocoa|peanut|nut) (milk|butter)|(milk|butter|egg|honey)[ -]?(free|alternative|substitute|style|flavour)', 'g');
          const clean = masked.replace(re,' ');
          if(hasPhrase(clean, n) === -1) return;
        }
        animal.push(v); return;
      }
    }
  });

  // crops with pesticide-monitoring context
  const crops = [];
  CTX.crops.forEach(function(c){
    for(const a of c.aka){
      if(hasPhrase(masked, norm(a)) !== -1){ crops.push(c); return; }
    }
  });

  found.sort(function(a,b){
    const d = TIER_ORDER.indexOf(a.entry.tier) - TIER_ORDER.indexOf(b.entry.tier);
    return d !== 0 ? d : a.pos - b.pos;
  });

  const counts = {exceeds:0,unsettled:0,context:0,settled:0};
  found.forEach(function(f){counts[f.entry.tier]++;});

  return {found:found, unknown:unknown, markers:markers, animal:animal, crops:crops, counts:counts, text:rawText};
}

const OFF_FIELDS = ['product_name','product_name_en','brands','quantity','ingredients_text_en',
  'ingredients_text','ingredients_text_debug','additives_tags','nova_group','nutriscore_grade',
  'ingredients_analysis_tags','image_front_small_url','nutriments','countries_tags','labels_tags','categories_tags'].join(',');

async function offLookup(code){
  const url = 'https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '?fields=' + OFF_FIELDS;
  const res = await fetch(url, {headers:{'Accept':'application/json'}});
  if(!res.ok) throw new Error('Lookup failed (HTTP ' + res.status + ')');
  const j = await res.json();
  if(j.status !== 1 || !j.product) throw new Error('notfound');
  return j.product;
}

/* ============================================================
   EAN-13 / EAN-8 / UPC-A decoder — pure JS, no dependencies.
   Works on a still photo or a live video frame.
   ============================================================ */
const L_PATTERNS = [
  [3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],
  [1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]
];
const PARITY = { // first digit -> parity of the six left digits (0 = L, 1 = G)
  '000000':0,'001011':1,'001101':2,'001110':3,'010011':4,
  '011001':5,'011100':6,'010101':7,'010110':8,'011010':9
};

function matchPattern(counts){
  // counts = four run lengths spanning 7 modules
  const total = counts[0]+counts[1]+counts[2]+counts[3];
  if(total <= 0) return null;
  const unit = total / 7;
  if(unit < 0.6) return null;
  let best = -1, bestErr = 0.72, bestRev = false;
  for(let d=0; d<10; d++){
    const p = L_PATTERNS[d];
    let err = 0, errR = 0;
    for(let i=0;i<4;i++){
      err  += Math.abs(counts[i]/unit - p[i]);
      errR += Math.abs(counts[3-i]/unit - p[i]);
    }
    if(err < bestErr){ bestErr = err; best = d; bestRev = false; }
    if(errR < bestErr){ bestErr = errR; best = d; bestRev = true; }
  }
  if(best < 0) return null;
  return {digit:best, reversed:bestRev};
}

function encodeRuns(bin, width){
  const runs = [];
  let cur = bin[0], len = 1;
  for(let i=1;i<width;i++){
    if(bin[i] === cur) len++;
    else { runs.push({black:cur, len:len}); cur = bin[i]; len = 1; }
  }
  runs.push({black:cur, len:len});
  return runs;
}

// Global threshold: fast, and right when the lighting across the barcode is even.
function runsFromLine(line, width){
  let min = 255, max = 0;
  for(let i=0;i<width;i++){ const v=line[i]; if(v<min)min=v; if(v>max)max=v; }
  if(max - min < 40) return null;               // flat / no contrast
  const thr = (min + max) / 2;
  const bin = new Uint8Array(width);
  for(let i=0;i<width;i++) bin[i] = line[i] < thr ? 1 : 0;
  return encodeRuns(bin, width);
}

// Local threshold: each pixel judged against the average of its neighbourhood.
// This is what rescues glare, vignetting and a barcode photographed at an angle,
// where one end of the same barcode is much brighter than the other.
function runsFromLineAdaptive(line, width){
  const win = Math.max(12, Math.round(width / 14));
  const sum = new Float64Array(width + 1);
  for(let i=0;i<width;i++) sum[i+1] = sum[i] + line[i];
  let min = 255, max = 0;
  for(let i=0;i<width;i++){ const v=line[i]; if(v<min)min=v; if(v>max)max=v; }
  if(max - min < 22) return null;
  const bin = new Uint8Array(width);
  for(let i=0;i<width;i++){
    const a = Math.max(0, i - win), b = Math.min(width, i + win + 1);
    const mean = (sum[b] - sum[a]) / (b - a);
    bin[i] = line[i] < mean - 3 ? 1 : 0;
  }
  return encodeRuns(bin, width);
}

// Cheap 1-D unsharp mask. Blur spreads a narrow bar into its neighbours; pulling the
// local average back out restores enough of the edge for the run-lengths to survive.
function sharpenLine(line, width, out){
  const r = 2;
  let acc = 0;
  for(let i=0;i<=r && i<width;i++) acc += line[i];
  let n = Math.min(r + 1, width);
  for(let i=0;i<width;i++){
    const mean = acc / n;
    const v = line[i] + (line[i] - mean) * 1.6;
    out[i] = v < 0 ? 0 : (v > 255 ? 255 : v);
    const add = i + r + 1, sub = i - r;
    if(add < width){ acc += line[add]; n++; }
    if(sub >= 0){ acc -= line[sub]; n--; }
  }
  return out;
}

function checksumOK(digits){
  const n = digits.length;
  let sum = 0;
  for(let i=0;i<n-1;i++){
    // weight 3 applies to positions that are an odd number of steps from the check digit
    const w = ((n - 1 - i) % 2 === 1) ? 3 : 1;
    sum += digits[i] * w;
  }
  return ((10 - (sum % 10)) % 10) === digits[n-1];
}

function decodeRuns(runs){
  // try each possible start position of a quiet-zone + start guard (black run first)
  for(let s=0; s<runs.length-28; s++){
    if(!runs[s].black) continue;
    const g = [runs[s].len, runs[s+1].len, runs[s+2].len];
    const gu = (g[0]+g[1]+g[2])/3;
    if(gu < 0.7) continue;
    if(Math.abs(g[0]/gu-1)>0.55 || Math.abs(g[1]/gu-1)>0.55 || Math.abs(g[2]/gu-1)>0.55) continue;

    // ---- EAN-13 attempt ----
    let ok = true, i = s+3, parity = '', digits = [];
    for(let d=0; d<6 && ok; d++){
      if(i+3 >= runs.length){ ok=false; break; }
      const r = matchPattern([runs[i].len,runs[i+1].len,runs[i+2].len,runs[i+3].len]);
      if(!r){ ok=false; break; }
      digits.push(r.digit); parity += r.reversed ? '1' : '0';
      i += 4;
    }
    if(ok && i+4 < runs.length){
      // middle guard: 5 runs, white-black-white-black-white of 1 module each
      const mg = [runs[i].len,runs[i+1].len,runs[i+2].len,runs[i+3].len,runs[i+4].len];
      const mu = (mg[0]+mg[1]+mg[2]+mg[3]+mg[4])/5;
      let mOK = mu > 0.5;
      for(let k=0;k<5 && mOK;k++) if(Math.abs(mg[k]/mu-1) > 0.7) mOK = false;
      if(mOK && PARITY[parity] !== undefined){
        let j = i+5, right = [], rOK = true;
        for(let d=0; d<6 && rOK; d++){
          if(j+3 >= runs.length){ rOK=false; break; }
          const r = matchPattern([runs[j].len,runs[j+1].len,runs[j+2].len,runs[j+3].len]);
          if(!r || r.reversed){ rOK=false; break; }
          right.push(r.digit); j += 4;
        }
        if(rOK){
          const all = [PARITY[parity]].concat(digits, right);
          if(checksumOK(all)) return all.join('');
        }
      }
    }

    // ---- EAN-8 attempt ----
    ok = true; i = s+3; digits = [];
    for(let d=0; d<4 && ok; d++){
      if(i+3 >= runs.length){ ok=false; break; }
      const r = matchPattern([runs[i].len,runs[i+1].len,runs[i+2].len,runs[i+3].len]);
      if(!r || r.reversed){ ok=false; break; }
      digits.push(r.digit); i += 4;
    }
    if(ok && i+4 < runs.length){
      const mg = [runs[i].len,runs[i+1].len,runs[i+2].len,runs[i+3].len,runs[i+4].len];
      const mu = (mg[0]+mg[1]+mg[2]+mg[3]+mg[4])/5;
      let mOK = mu > 0.5;
      for(let k=0;k<5 && mOK;k++) if(Math.abs(mg[k]/mu-1) > 0.7) mOK = false;
      if(mOK){
        let j = i+5, right = [], rOK = true;
        for(let d=0; d<4 && rOK; d++){
          if(j+3 >= runs.length){ rOK=false; break; }
          const r = matchPattern([runs[j].len,runs[j+1].len,runs[j+2].len,runs[j+3].len]);
          if(!r || r.reversed){ rOK=false; break; }
          right.push(r.digit); j += 4;
        }
        if(rOK){
          const all = digits.concat(right);
          if(checksumOK(all)) return all.join('');
        }
      }
    }
  }
  return null;
}

function grayFromImageData(id){
  const {width:w, height:h, data:d} = id;
  const g = new Uint8ClampedArray(w*h);
  for(let i=0, p=0; i<d.length; i+=4, p++){
    g[p] = (d[i]*77 + d[i+1]*151 + d[i+2]*28) >> 8;
  }
  return {g:g, w:w, h:h};
}

function tryRuns(runs){
  if(!runs) return null;
  const r = decodeRuns(runs);
  if(r) return r;
  return decodeRuns(runs.slice().reverse());   // barcode read right-to-left
}

function scanGray(gray, rows){
  const {g, w, h} = gray;
  rows = rows || 40;
  const line = new Uint8ClampedArray(w);
  const avg  = new Uint8ClampedArray(w);
  const sharp = new Uint8ClampedArray(w);
  for(let k=0;k<rows;k++){
    const frac = 0.08 + 0.84 * (k / (rows - 1));
    const y = Math.min(h-1, Math.max(0, Math.round(frac * h)));
    const off = y * w;
    for(let x=0;x<w;x++) line[x] = g[off + x];

    let r = tryRuns(runsFromLine(line, w));      if(r) return r;
    r = tryRuns(runsFromLineAdaptive(line, w));  if(r) return r;

    // a 3-row average beats sensor noise
    if(y > 1 && y < h-2){
      for(let x=0;x<w;x++) avg[x] = (g[off-w+x] + g[off+x] + g[off+w+x]) / 3;
      r = tryRuns(runsFromLine(avg, w));         if(r) return r;
      r = tryRuns(runsFromLineAdaptive(avg, w)); if(r) return r;
      // and sharpening rescues a soft-focus shot
      sharpenLine(avg, w, sharp);
      r = tryRuns(runsFromLineAdaptive(sharp, w)); if(r) return r;
      r = tryRuns(runsFromLine(sharp, w));         if(r) return r;
    }
  }
  return null;
}

function rotateGray(gray){
  const {g,w,h} = gray;
  const out = new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) out[x*h + (h-1-y)] = g[y*w + x];
  return {g:out, w:h, h:w};
}

const CV = document.getElementById('cv');
const CTX2D = CV.getContext('2d', {willReadFrequently:true});

// rect (optional) crops a region of the source and blows it up to the working size —
// that is what makes a barcode occupying a small part of the frame readable.
function decodeFromSource(src, sw, sh, maxDim, rect, rows){
  maxDim = maxDim || 900;
  const rx = rect ? rect.x : 0, ry = rect ? rect.y : 0;
  const rw = rect ? rect.w : sw, rh = rect ? rect.h : sh;
  const scale = rect ? (maxDim / Math.max(rw, rh)) : Math.min(1, maxDim / Math.max(rw, rh));
  const w = Math.max(2, Math.round(rw * scale)), h = Math.max(2, Math.round(rh * scale));
  CV.width = w; CV.height = h;
  CTX2D.drawImage(src, rx, ry, rw, rh, 0, 0, w, h);
  const gray = grayFromImageData(CTX2D.getImageData(0, 0, w, h));
  return scanGray(gray, rows) || scanGray(rotateGray(gray), rows);
}

function centreRect(sw, sh, frac){
  const w = sw * frac, h = sh * frac;
  return {x: (sw - w) / 2, y: (sh - h) / 2, w: w, h: h};
}

async function decodeImageFile(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise(function(res, rej){
      const im = new Image();
      im.onload = function(){res(im);};
      im.onerror = function(){rej(new Error('Could not read that image'));};
      im.src = url;
    });
    const sw = img.naturalWidth, sh = img.naturalHeight;

    // 1. whole frame at progressively larger working sizes: cheap first, then thorough
    for(const dim of [900, 1400, 2000, 2600]){
      const r = decodeFromSource(img, sw, sh, dim);
      if(r) return r;
    }
    // 2. crop towards the middle and magnify — for a barcode small in the frame
    for(const frac of [0.7, 0.5, 0.35]){
      const r = decodeFromSource(img, sw, sh, 1800, centreRect(sw, sh, frac), 56);
      if(r) return r;
    }
    // 3. horizontal bands, in case the barcode sits off-centre vertically
    for(const band of [0.25, 0.5, 0.75]){
      const h = sh * 0.42;
      const r = decodeFromSource(img, sw, sh, 1800,
        {x: 0, y: Math.max(0, Math.min(sh - h, sh * band - h / 2)), w: sw, h: h}, 44);
      if(r) return r;
    }
    return null;
  } finally { URL.revokeObjectURL(url); }
}

function renderResult(a){
  LAST = a;
  const p = a.product;
  const byTier = {};
  TIER_ORDER.forEach(function(t){ byTier[t] = a.found.filter(function(f){return f.entry.tier === t;}); });

  let head = '';
  if(p){
    head = '<div class="card"><div class="prod">' +
      (p.image_front_small_url ? '<img src="'+esc(p.image_front_small_url)+'" alt="">' : '') +
      '<div><h2>'+esc(p.product_name || p.product_name_en || 'Unnamed product')+'</h2>' +
      '<div class="brand">'+esc([p.brands, p.quantity].filter(Boolean).join(' · '))+'</div></div></div>' +
      '<p class="note" style="margin:12px 0 0">Ingredients from Open Food Facts, which is community-entered. Check them against the packet before you rely on them.</p></div>';
  }

  const flagged = a.found.length;
  const hot = byTier.exceeds.length + byTier.unsettled.length;
  let verdict;
  if(!flagged) verdict = 'Nothing in this list matched the database. Either it is a genuinely short ingredient list, or the text did not come through cleanly.';
  else if(!hot) verdict = 'Nothing here has an open safety question. ' + flagged + ' recognised ' + (flagged===1?'entry':'entries') + ', all either settled or just worth knowing about.';
  else verdict = hot + ' ' + (hot===1?'thing':'things') + ' here ' + (hot===1?'is':'are') + ' worth a second look — not because ' + (hot===1?'it is':'they are') + ' proven harmful, but because the evidence is unfinished. The rest is ordinary.';

  const saltRaw = p && p.nutriments && (p.nutriments.salt_100g != null) ? Number(p.nutriments.salt_100g) : null;
  const salt = (saltRaw != null && !isNaN(saltRaw)) ? saltRaw : null;
  const saltNamed = a.found.some(function(f){return f.entry.name === 'Salt (sodium)';});
  let saltHTML = '';
  if(salt != null || saltNamed){
    let gauge = '';
    if(salt != null){
      const pct = Math.min(100, salt / 2.0 * 100);
      const col = salt >= 1.5 ? 'var(--red)' : (salt >= 0.3 ? 'var(--amber)' : 'var(--grey)');
      const band = salt >= 1.5 ? 'high' : (salt >= 0.3 ? 'medium' : 'low');
      gauge = '<b>Salt: ' + salt.toFixed(2) + ' g per 100 g</b> <span class="pill '+(salt>=1.5?'red':(salt>=0.3?'amber':'grey'))+'">'+band+'</span>' +
        '<div class="bar-nut"><i style="width:'+pct.toFixed(0)+'%;background:'+col+'"></i></div>';
    } else {
      gauge = '<b>Salt is in this list, but no quantity is available here.</b><p class="sub" style="margin:6px 0 0">Read it off the nutrition panel on the packet — per 100 g, not per portion.</p>';
    }
    saltHTML = '<h3 class="sec">The number that matters more than any of this</h3><div class="card">' + gauge +
      '<p class="note" style="margin-top:10px">UK front-of-pack thresholds: low is 0.3 g or less per 100 g, high is above 1.5 g. Adults are advised to stay under 6 g a day and average about 8.4 g. Salt has a far stronger evidence base for harm than every additive on this page put together — and it is the specific weak spot of plant-based versions: a survey of 207 plant-based against 226 meat products found the plant-based ones saltier in five of six categories, with only two qualifying as low-salt against 45 of the meat products.</p></div>';
  }

  const marks = a.markers.length ? '<h3 class="sec">How built is this?</h3><div class="card">' +
      '<p class="sub" style="margin:0 0 10px"><b>' + a.markers.length + ' marker' + (a.markers.length===1?'':'s') + ' of industrial formulation.</b> None of these is a safety flag on its own. Together they tell you whether you are holding a recipe or a specification.</p>' +
      a.markers.map(function(m){
        return '<div class="legend"><span class="dot d-yellow"></span><div><b>'+esc(m.n)+'</b>'+esc(m.why)+'</div></div>';
      }).join('') +
      (p && p.nova_group ? '<p class="note" style="margin-top:12px">Open Food Facts puts this in NOVA group '+esc(String(p.nova_group))+'. NOVA is a useful shorthand and a blunt one — the British Nutrition Foundation notes it is applied inconsistently and sweeps fortified plant milks in alongside confectionery.</p>' : '') +
      '</div>' : '';

  // vegan / origin
  const originCheck = a.found.filter(function(f){return f.entry.vegan === 'check';});
  const originNo    = a.found.filter(function(f){return f.entry.vegan === 'no';});
  let veg = '';
  if(a.animal.length || originNo.length || originCheck.length){
    veg = '<h3 class="sec">Animal-derived check</h3><div class="card">' +
      (a.animal.length ? '<p class="sub" style="margin:0 0 8px"><b>Named animal ingredients:</b> ' + a.animal.map(function(v){return esc(v.n);}).join(', ') + '.</p>' : '') +
      (originNo.length ? '<p class="sub" style="margin:0 0 8px"><b>Animal-derived additives:</b> ' + originNo.map(function(f){return esc(f.entry.name);}).join(', ') + '.</p>' : '') +
      (originCheck.length ? '<p class="sub" style="margin:0 0 8px"><b>Origin not declared, could go either way:</b> ' + originCheck.map(function(f){return esc(f.entry.name);}).join(', ') + '. UK labelling does not require additive sources to be stated — only allergens. You cannot resolve these from the packet.</p>' : '') +
      '<p class="note" style="margin:10px 0 0">Processing aids are the bigger gap: isinglass in cask ale, gelatine finings in wine, animal rennet in PDO cheeses like Parmigiano Reggiano. None of them has to appear on a label at all. An explicit "suitable for vegans" claim is the only reliable signal.</p></div>';
  }

  // pesticide context
  let pest = '';
  if(a.crops.length){
    const rows = a.crops.slice().sort(function(x,y){return y.multi - x.multi;});
    pest = '<h3 class="sec">Pesticide-residue context</h3><div class="card">' +
      rows.map(function(c){
        return '<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)">' +
          '<span>'+esc(c.n)+'</span><span class="muted" style="font-variant-numeric:tabular-nums">'+c.multi+'% of samples had 2+ residues</span></div>';
      }).join('') +
      '<p class="note" style="margin-top:12px">' + esc(CTX.meta.residueNote) + '</p>' +
      '<p class="note" style="margin-top:8px">For scale: in 2024 UK testing of 3,482 samples, 51% had no detectable residues at all, 47% were within legal limits and 2.07% exceeded them. Animal products came back with no detectable residues in 99.4% of samples — but that is because they are screened for different substances. The chemicals that actually exceed European health guidance are dioxins and PCBs, and those concentrate in animal fat, dairy and fish, not in fruit and veg.</p></div>';
  }

  const unknownHTML = a.unknown.length ? '<h3 class="sec">Not in the database yet</h3><div class="card"><p class="sub" style="margin:0">' +
      a.unknown.map(function(u){return '<span class="pill">'+esc(u)+'</span>';}).join(' ') +
      '</p><p class="note" style="margin:10px 0 0">These E-numbers were found on the label but this app has no entry for them. It covers the additives you actually meet in a British supermarket, not all 300-odd authorised ones. Look them up on the <a href="https://www.food.gov.uk/business-guidance/approved-additives-and-e-numbers" target="_blank" rel="noopener">FSA approved additives list</a>.</p></div>' : '';

  APP.innerHTML = head +
    '<div class="card"><p style="margin:0;font-size:15px">'+esc(verdict)+'</p>' +
    '<div class="tally">' + TIER_ORDER.map(function(t){
        return '<div class="tal t-'+TIER[t].cls+'"><b>'+a.counts[t]+'</b><span>'+ (t==='exceeds'?'Concern':t==='unsettled'?'Unsettled':t==='context'?'Know':'Settled') +'</span></div>';
      }).join('') + '</div></div>' +
    tierBlock(byTier.exceeds,'exceeds') +
    tierBlock(byTier.unsettled,'unsettled') +
    tierBlock(byTier.context,'context') +
    tierBlock(byTier.settled,'settled') +
    unknownHTML + marks + veg + pest + saltHTML +
    '<h3 class="sec">The list you gave me</h3><div class="card"><p class="note" style="white-space:pre-wrap">'+esc(a.text)+'</p></div>' +
    '<div style="margin-top:14px"><button class="btn sec" id="again">Check something else</button></div>';

  APP.querySelectorAll('.item .hd').forEach(function(b){
    b.onclick = function(){ b.parentElement.classList.toggle('open'); };
  });
  document.getElementById('again').onclick = function(){ go('home'); };
}

function remember(a){
  RECENT.unshift({title: a.title || 'Result', data: a});
  if(RECENT.length > 6) RECENT.pop();
}

/* ---------------- LIBRARY ---------------- */
let libFilter = 'all', libQ = '';
function renderLibrary(){
  const filters = [['all','Everything'],['exceeds','Concern'],['unsettled','Unsettled'],['context','Worth knowing'],['settled','Settled'],['animal','Animal or unclear origin']];
  const list = DB.filter(function(a){
    if(libFilter === 'animal'){ if(a.vegan === 'yes') return false; }
    else if(libFilter !== 'all' && a.tier !== libFilter) return false;
    if(!libQ) return true;
    const q = norm(libQ);
    return norm(a.name).indexOf(q) !== -1 || norm(a.code).indexOf(q) !== -1 ||
           (a.aka||[]).some(function(x){return norm(x).indexOf(q) !== -1;});
  });
  APP.innerHTML =
    '<div class="hero"><h1>Library</h1><p>Every entry, browsable. '+DB.length+' additives and ingredients.</p></div>' +
    '<input type="text" id="lq" placeholder="Search — e.g. E466, carrageenan, shellac" value="'+esc(libQ)+'">' +
    '<div class="tabs">' + filters.map(function(f){
      return '<button class="tab'+(libFilter===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>';
    }).join('') + '</div>' +
    (list.length ? list.map(function(a){return itemHTML(a, a.tier);}).join('') : '<div class="card"><p class="note">Nothing matches.</p></div>');
  const q = document.getElementById('lq');
  q.oninput = function(){ libQ = q.value; const s = q.selectionStart; renderLibrary(); const n = document.getElementById('lq'); n.focus(); n.setSelectionRange(s,s); };
  APP.querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ libFilter = b.dataset.f; renderLibrary(); }; });
  APP.querySelectorAll('.item .hd').forEach(function(b){ b.onclick = function(){ b.parentElement.classList.toggle('open'); }; });
}

  '<p class="sub" style="margin-top:8px">Separate <b>hazard</b> from <b>risk</b>. A hazard is whether something can cause harm under any conditions. A risk is whether it will, at the amount you actually eat. Almost every alarming food headline collapses the two. Aspartame being classed "possibly carcinogenic" is a hazard statement, and the same organisation reaffirmed a safe intake of roughly nine to fourteen cans of diet drink a day on the same afternoon.</p></div>' +
  '<div class="card"><h3 style="font-size:15px">Why there is no score</h3>' +

async function lookupBarcode(code){
  go('loading', 'Looking up ' + code + '…');
  let p = null;
  try{
    p = await offLookup(code);
  }catch(err){
    if(err && err.message === 'notfound'){
      APP.innerHTML = '<div class="card"><b>Not in the database</b><p class="sub" style="margin-top:8px">Barcode '+esc(code)+' is not in Open Food Facts. That is common for own-brand and newer UK products. Photograph or paste the ingredients instead — the analysis is identical.</p></div>' +
        '<div style="margin-top:10px"><button class="btn" id="toPaste">Paste the ingredients</button></div>' +
        '<div style="margin-top:8px"><button class="btn sec" id="toHome">Back</button></div>';
    } else {
      const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
      APP.innerHTML = '<div class="card"><b>' + (offline ? 'You are offline' : 'Could not reach the product database') + '</b><p class="sub" style="margin-top:8px">' +
        (offline
          ? 'Barcode lookup is the one part of this that needs a signal.'
          : esc(err.message||'Network error') + '. That is usually signal, but it can also happen when the page is opened as a local file and the browser blocks the request.') +
        ' Photographing the label or pasting the ingredients works entirely offline and gives you the identical analysis.</p></div>' +
        '<div style="margin-top:10px"><button class="btn" id="toPaste">Paste the ingredients</button></div>' +
        '<div style="margin-top:8px"><button class="btn sec" id="toHome">Back</button></div>';
    }
    const tp = document.getElementById('toPaste'); if(tp) tp.onclick = function(){ go('paste'); };
    const th = document.getElementById('toHome');  if(th) th.onclick = function(){ go('home'); };
    return;
  }
  const ing = p.ingredients_text_en || p.ingredients_text || '';
  if(!ing.trim()){
    go('paste','');
    setTimeout(function(){
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = '<p class="note">Found <b>'+esc(p.product_name||code)+'</b> but Open Food Facts has no ingredients text for it. Paste them from the packet above.</p>';
      APP.insertBefore(c, APP.children[1]);
    }, 0);
    return;
  }
  const a = analyse(ing);
  a.product = p;
  a.title = (p.product_name || p.product_name_en || code).slice(0,28);
  remember(a);
  go('result', a);
}

/* ----- live camera scan ----- */
// A browser will only hand over the camera on a secure origin. Opened straight from
// Files or Downloads the page is file:// — not secure — so live scanning is simply
// unavailable and there is no point pretending otherwise. The camera-photo route
// works everywhere, because it is the phone's own camera app handing back an image.
// Note: Chromium reports file:// as a "secure context" while Safari does not, so
// isSecureContext alone is not a reliable test. Treat a local file as no-live-camera
// either way — the photo route works identically and is predictable across phones.
const LIVE_CAMERA_OK = (function(){
  try{
    if(location.protocol === 'file:') return false;
    return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  }catch(_){ return false; }
})();

let stream = null, scanTimer = null, torchTrack = null, wakeLock = null;

async function startScan(){
  if(!LIVE_CAMERA_OK){ document.getElementById('fileBarcode').click(); return; }
  SCAN.style.display = 'flex';
  SCANST.textContent = 'Starting camera…';
  document.getElementById('scanTorch').classList.add('hidden');
  document.getElementById('scanTorch').classList.remove('on');
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:{ideal:'environment'},
        width:{ideal:1920}, height:{ideal:1080},
        focusMode:'continuous', advanced:[{focusMode:'continuous'}]
      }, audio:false
    });
    VID.srcObject = stream;
    await VID.play();
    SCANST.textContent = 'Fill the box with the barcode';

    // torch, where the device exposes it (Android mostly; iOS Safari does not)
    torchTrack = stream.getVideoTracks()[0] || null;
    try{
      const caps = torchTrack && torchTrack.getCapabilities ? torchTrack.getCapabilities() : {};
      if(caps && caps.torch) document.getElementById('scanTorch').classList.remove('hidden');
    }catch(_){}

    // keep the screen on while they line the packet up
    try{
      if(navigator.wakeLock && navigator.wakeLock.request) wakeLock = await navigator.wakeLock.request('screen');
    }catch(_){}

    let native = null;
    if('BarcodeDetector' in window){
      try{ native = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}); }catch(_){ native = null; }
    }
    let ticks = 0;
    scanTimer = setInterval(async function(){
      if(VID.readyState < 2) return;
      ticks++;
      if(ticks === 32) SCANST.textContent = 'Struggling? Move back a little, or tap Photo';
      let code = null;
      if(native){
        try{
          const r = await native.detect(VID);
          if(r && r.length) code = r[0].rawValue;
        }catch(_){ native = null; }
      }
      if(!code){
        try{ code = decodeFromSource(VID, VID.videoWidth, VID.videoHeight, 1100); }catch(_){}
      }
      if(code){
        try{ if(navigator.vibrate) navigator.vibrate(30); }catch(_){}
        stopScan();
        lookupBarcode(code.replace(/\D/g,''));
      }
    }, 200);
  }catch(err){
    stopScan();
    document.getElementById('fileBarcode').click();
  }
}
function stopScan(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if(stream){ stream.getTracks().forEach(function(t){t.stop();}); stream = null; }
  if(wakeLock){ try{ wakeLock.release(); }catch(_){} wakeLock = null; }
  torchTrack = null;
  VID.srcObject = null;
  SCAN.style.display = 'none';
}
document.getElementById('scanClose').onclick = stopScan;
document.getElementById('scanPhoto').onclick = function(){ stopScan(); document.getElementById('fileBarcode').click(); };
document.getElementById('scanTorch').onclick = async function(){
  if(!torchTrack) return;
  const on = !this.classList.contains('on');
  try{
    await torchTrack.applyConstraints({advanced:[{torch:on}]});
    this.classList.toggle('on', on);
  }catch(_){ this.classList.add('hidden'); }
};

/* ----- OCR of the ingredients label ----- */
document.getElementById('fileLabel').onchange = async function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!f) return;
  go('loading','Loading the text reader…');
  let T = null;
  try{
    T = await loadTesseract();
  }catch(err){
    APP.innerHTML = '<div class="card"><b>Text reader unavailable</b><p class="sub" style="margin-top:8px">The OCR engine loads from a public CDN and could not be reached here. There is a better route anyway: open your phone\'s camera or photo, press and hold on the ingredients text to select it with Live Text (iPhone) or Google Lens (Android), copy, and paste it in. Phone OCR beats in-app OCR on curved, shiny packaging.</p></div>' +
      '<div style="margin-top:10px"><button class="btn" id="toP">Paste the text</button></div>' +
      '<div style="margin-top:8px"><button class="btn sec" id="toH2">Back</button></div>';
    document.getElementById('toP').onclick = function(){ go('paste'); };
    document.getElementById('toH2').onclick = function(){ go('home'); };
    return;
  }
  go('loading','Reading the label — this takes a few seconds…');
  try{
    const { data } = await T.recognize(f, 'eng');
    let txt = (data && data.text || '').replace(/\s+/g,' ').trim();
    const m = txt.match(/ingredients?\s*[:.]?\s*(.+)/i);
    if(m) txt = m[1];
    go('paste', txt);
  }catch(err){
    go('paste','');
  }
};

let _tess = null;
function loadTesseract(){
  if(_tess) return Promise.resolve(_tess);
  return new Promise(function(res, rej){
    const to = setTimeout(function(){ rej(new Error('timeout')); }, 15000);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js';
    s.onload = function(){ clearTimeout(to); if(window.Tesseract){ _tess = window.Tesseract; res(_tess); } else rej(new Error('missing')); };
    s.onerror = function(){ clearTimeout(to); rej(new Error('blocked')); };
    document.head.appendChild(s);
  });
}
