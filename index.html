produce laxative effects' above 10% polyol content. They are also high-FODMAP, so relevant for IBS. Xylitol is genuinely toxic to dogs. The same research group that published the erythritol work reported a similar cardiovascular association for blood xylitol in the European Heart Journal in 2024, with the same reverse-causation caveat attached.","adi":"No numerical ADI; laxative threshold labelling required above 10%","uk":"Permitted in GB and NI","refs":[{"t":"Witkowski et al., xylitol and cardiovascular risk, Eur Heart J 2024","u":"https://academic.oup.com/eurheartj/article/45/27/2439/7683453"}]},{"code":"—","name":"Rennet / animal rennet","aka":["rennet","animal rennet","traditional rennet","microbial rennet","vegetarian rennet"],"class":"Enzyme (processing aid)","job":"Coagulates milk into curds. The definitive step in cheesemaking.","origin":"Traditional rennet is chymosin from the fourth stomach of unweaned calves. Most UK cheese now uses microbial or fermentation-produced chymosin.","originType":"animal (traditional) or microbial","vegan":"no","tier":"context","why":"A processing aid, so it is often NOT declared on the label at all. Protected-name cheeses like Parmigiano Reggiano, Grana Padano, Gorgonzola and traditional Pecorino must use animal rennet by their PDO rules — so those cheeses are never vegetarian, regardless of what the packet implies.","adi":"Not applicable","uk":"Processing aid — no labelling requirement","refs":[]},{"code":"—","name":"Isinglass (fining agent)","aka":["isinglass","finings","fining agent","gelatine finings"],"class":"Processing aid","job":"Clarifies cask beer and some wines by dragging yeast out of suspension.","origin":"ANIMAL. Collagen from fish swim bladders. Gelatine, egg albumen and casein are also used as fining agents.","originType":"animal (fish)","vegan":"no","tier":"context","why":"The clearest example of the processing-aid loophole: because it is filtered out, it does not have to appear on the label at all. A pint of cask ale or a bottle of wine can be non-vegan with nothing on the packaging to tell you. Look for an explicit 'suitable for vegans' claim — that is the only reliable signal.","adi":"Not applicable","uk":"Processing aid — no labelling requirement","refs":[]},{"code":"—","name":"Vitamin D3 (cholecalciferol)","aka":["vitamin d3","cholecalciferol","vitamin d"],"class":"Fortificant","job":"Added to plant milks, spreads, cereals and some drinks.","origin":"Usually made from lanolin (sheep's wool grease) or, less often, fish liver oil. Vegan D3 from lichen exists and is more expensive. Vitamin D2 (ergocalciferol) is from yeast and always vegan.","originType":"variable — animal (usual) or lichen","vegan":"check","tier":"context","why":"Not a health flag — it is a nutrient most people in the UK are short of in winter. It is here because a fortified plant milk labelled 'vitamin D' can contain a sheep-derived ingredient unless it specifies vegan D3 or D2. Products certified vegan will have sourced it accordingly.","adi":"Upper intake level 100 micrograms/day for adults","uk":"Permitted; source not required on label","refs":[]},{"code":"—","name":"Omega-3 / DHA fortification","aka":["omega-3","dha","epa","fish oil","algal oil"],"class":"Fortificant","job":"Added to spreads, drinks, eggs and plant milks.","origin":"Usually fish oil; algal oil versions are vegan and increasingly common in plant-based products.","originType":"variable — fish or algae","vegan":"check","tier":"context","why":"Origin flag. If the label says 'algal oil' or 'DHA from algae' it is vegan; if it just says omega-3 or DHA, it may not be.","adi":"Not applicable","uk":"Permitted; fish is a declarable allergen","refs":[]},{"code":"—","name":"Mechanically separated meat","aka":["mechanically separated meat","msm","mechanically recovered meat","mrm"],"class":"Meat ingredient","job":"Residual meat forced off bones under pressure into a paste, used in cheap sausages, nuggets and reformed products.","origin":"Animal carcass residue.","originType":"animal","vegan":"no","tier":"context","why":"Must be declared separately and CANNOT count towards the declared meat content — so a sausage labelled '42% pork' plus mechanically separated pork contains more animal material than the percentage suggests. Prohibited from bovine, ovine and caprine bones in the UK for BSE reasons. This is the meat-side equivalent of the fractionated-protein flag on the plant side.","adi":"Not applicable","uk":"Must be declared; cannot count as 'meat'","refs":[{"t":"UK guidance on meat labelling","u":"https://www.businesscompanion.info/en/quick-guides/food-and-drink/labelling-of-meat-and-products-containing-meat"}]},{"code":"—","name":"Added water and 'added water' in meat","aka":["added water","water added","brine","chicken with added water"],"class":"Ingredient","job":"Added along with salt and phosphates to increase weight and juiciness in ham, bacon, chicken and reformed products.","origin":"Water.","originType":"n/a","vegan":"yes","tier":"context","why":"Where more than 5% water has been added to a meat product that looks like a cut, joint, slice or portion — ham, bacon, chicken breast — UK law requires it to appear in the product NAME, not just the ingredient list. The same applies to fishery products. Worth reading the name rather than the front of the pack: 'ham with added water' is a different purchase from 'ham'. Usually paired with polyphosphates (E450-E452), which are what hold the water in. Note the rule does not extend to all processed meat products, so a sausage or a pie is not covered.","adi":"Not applicable","uk":"Must appear in the product name above 5% for cuts, joints, slices and portions of meat and fish","refs":[]},{"code":"—","name":"Inulin / chicory root fibre / oligofructose","aka":["inulin","chicory root fibre","chicory root extract","oligofructose","fructo-oligosaccharides","fos"],"class":"Fibre ingredient","job":"Adds declarable fibre and a little sweetness and bulk, especially in 'high fibre' and low-sugar bars and yoghurts.","origin":"Extracted from chicory root or Jerusalem artichoke.","originType":"plant extract","vegan":"yes","tier":"context","why":"Genuinely a prebiotic fibre with a reasonable evidence base. The flag is practical: it is strongly fermentable and high-FODMAP, so added at the levels needed to make a fibre claim it causes significant bloating and wind in many people, and is a common trigger in IBS. A 'high fibre' bar that makes you uncomfortable is usually this.","adi":"Not applicable","uk":"Permitted as an ingredient","refs":[]},{"code":"—","name":"Salt (sodium)","aka":["salt","sodium chloride","sea salt","rock salt"],"class":"Ingredient","job":"Flavour, preservation, protein binding and texture.","originType":"mineral","origin":"Mined or evaporated from seawater.","vegan":"yes","tier":"context","why":"Salt is in almost everything, so flagging it red on every product would tell you nothing — the number, not the presence, is what matters, and it is shown separately above. Worth stating plainly, though, that it dwarfs every additive on this list. UK adults average around 8.4 g a day against a 6 g recommendation, and salt is the best-evidenced dietary driver of high blood pressure and stroke in the population. It is also the specific weak point of many plant-based products: an Action on Salt survey of 207 plant-based versus 226 meat products found the plant-based versions significantly saltier in five of six categories, with only two products qualifying as low salt versus 45 of the meat products. If you are scanning a meat alternative, the salt figure is a more important number than any E-number in the list.","adi":"UK recommendation: maximum 6 g salt (2.4 g sodium) per day for adults","uk":"Voluntary reformulation targets set by government","refs":[{"t":"Action on Salt plant-based survey, Nutrients 2021","u":"https://doi.org/10.3390/nu13124225"}]},{"code":"E100","name":"Curcumin","aka":["curcumin","e 100","turmeric extract"],"class":"Colour (yellow)","job":"Bright yellow in mustard, pickles, savoury rice, margarine and confectionery. The standard replacement for tartrazine in reformulated UK products.","origin":"Extracted and purified from turmeric rhizome.","originType":"plant extract","vegan":"yes","tier":"settled","why":"EFSA re-evaluated it in 2010 and set an ADI of 3 mg/kg bw/day. It noted that exposure could approach or slightly exceed the ADI for high-consuming children at maximum permitted levels, which is worth knowing but is a long way from a safety alarm. No cohort signal.","adi":"3 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E101","name":"Riboflavin (vitamin B2)","aka":["riboflavin","riboflavin-5'-phosphate","vitamin b2","e 101"],"class":"Colour (yellow)","job":"Yellow colour in desserts, sauces and drinks; also added as a vitamin.","origin":"Made by fermentation (usually Bacillus subtilis or Ashbya gossypii).","originType":"microbial fermentation","vegan":"yes","tier":"settled","why":"It is vitamin B2. Water-soluble, excess is excreted, no numerical ADI needed. It is also why B-vitamin supplements turn urine fluorescent yellow.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E127","name":"Erythrosine","aka":["erythrosine","e 127","fd&c red 3"],"class":"Colour (pink/red)","job":"In the UK and EU its use is restricted almost entirely to cocktail cherries and candied cherries. That is the whole story of where you will meet it.","origin":"Synthetic iodinated xanthene dye.","originType":"synthetic","vegan":"yes","tier":"unsettled","why":"It has one of the lowest ADIs of any permitted colour, 0.1 mg/kg bw/day, set because high doses affect the thyroid in rats — an iodine-mediated effect whose relevance to humans is debated. Its use was narrowed to cherries precisely to keep exposure low. In January 2025 the US FDA revoked authorisation of the same dye (Red 3) in food, on the basis of the rat findings and a legal clause requiring removal of anything carcinogenic in animals. The UK and EU have not followed. Another live regulatory disagreement rather than a settled fact.","adi":"0.1 mg/kg bw/day","uk":"Permitted in GB and NI, restricted to cocktail and candied cherries","refs":[]},{"code":"E131","name":"Patent blue V","aka":["patent blue v","patent blue","e 131"],"class":"Colour (blue)","job":"Blue and, mixed with yellow, green shades in confectionery, drinks and decorations.","origin":"Synthetic triarylmethane dye.","originType":"synthetic","vegan":"yes","tier":"context","why":"EFSA re-evaluated it in 2013 and set an ADI of 5 mg/kg bw/day, concluding exposure was below it. Documented but rare hypersensitivity reactions, mostly reported from its medical use as a surgical dye at far higher doses. Not permitted in the US.","adi":"5 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E132","name":"Indigotine (indigo carmine)","aka":["indigotine","indigo carmine","e 132"],"class":"Colour (blue)","job":"Blue in sweets, ice cream and icing.","origin":"Synthetic dye. Despite the name, no connection to cochineal or carmine.","originType":"synthetic","vegan":"yes","tier":"context","why":"EFSA re-evaluated it in 2014 and set an ADI of 5 mg/kg bw/day with exposure below it. Not one of the Southampton six and no warning label required. Worth knowing only because 'carmine' in its alternative name makes people think it is the insect dye. It is not.","adi":"5 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E133","name":"Brilliant blue FCF","aka":["brilliant blue","brilliant blue fcf","e 133","fd&c blue 1"],"class":"Colour (blue)","job":"The standard blue — sweets, iced drinks, novelty products, and mixed with yellows to make greens.","origin":"Synthetic triarylmethane dye.","originType":"synthetic","vegan":"yes","tier":"settled","why":"Poorly absorbed from the gut. EFSA re-evaluated it in 2010 and set an ADI of 6 mg/kg bw/day, with exposure below it in all groups. Not a Southampton colour.","adi":"6 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E142","name":"Green S","aka":["green s","e 142"],"class":"Colour (green)","job":"Green in tinned peas, mint sauce, jellies and cake decorations. A characteristically British additive.","origin":"Synthetic dye.","originType":"synthetic","vegan":"yes","tier":"context","why":"EFSA re-evaluated it in 2010 and set an ADI of 5 mg/kg bw/day. Not permitted in the US, Canada, Japan or Norway, which is the usual reason people are suspicious of it — but those are regulatory choices about which colours to authorise rather than findings of harm.","adi":"5 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E140","name":"Chlorophylls and chlorophyllins (E140, E141)","aka":["chlorophyll","chlorophylls","chlorophyllins","copper complexes of chlorophyll","e 140","e 141"],"class":"Colour (green)","job":"Natural green in mint products, ice cream, sauces and drinks. E141 is the copper-stabilised version, which holds its colour far better.","origin":"Extracted from grass, lucerne and nettles. E141 has copper substituted into the molecule.","originType":"plant extract","vegan":"yes","tier":"settled","why":"Chlorophyll is what makes plants green and you eat grams of it in vegetables. EFSA raised no safety concern; for E141 the only consideration is the added copper, which is a nutrient at these levels.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E153","name":"Vegetable carbon","aka":["vegetable carbon","carbon black","e 153","activated charcoal"],"class":"Colour (black)","job":"Black in novelty ice cream, some cheese rinds, and jelly sweets.","origin":"Carbonised plant material — burnt wood or coconut shell, purified.","originType":"plant, carbonised","vegan":"yes","tier":"context","why":"Inert and not absorbed. EFSA re-evaluated it in 2012, found the toxicological data too limited to set an ADI, and concluded it was safe at reported use levels provided residual polycyclic aromatic hydrocarbons from the carbonisation stay below 1.0 microgram per kg as benzo[a]pyrene — so the specification is doing the safety work. You will also see claims that charcoal in food blocks medication including the contraceptive pill: that interaction is documented for pharmaceutical-dose activated charcoal, which is a different material at a vastly higher dose, and there is no FSA or MHRA warning about the food colour. Treat it as plausible-sounding but unsupported.","adi":"No ADI could be set; safety rests on the PAH specification limit","uk":"Permitted in GB and NI","refs":[]},{"code":"E151","name":"Brilliant black BN (black PN)","aka":["brilliant black","brilliant black bn","black pn","e 151"],"class":"Colour (black)","job":"Black and, blended, brown and purple shades in sauces, jellies and blackcurrant products.","origin":"Synthetic azo dye.","originType":"synthetic","vegan":"yes","tier":"context","why":"An azo dye but not one of the Southampton six, so no warning label. EFSA re-evaluated it in 2010 and set an ADI of 5 mg/kg bw/day. Not permitted in the US, Canada or Japan.","adi":"5 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E155","name":"Brown HT","aka":["brown ht","chocolate brown ht","e 155"],"class":"Colour (brown)","job":"Chocolate-brown shades in cakes, biscuits and desserts where caramel colour is not strong enough.","origin":"Synthetic azo dye.","originType":"synthetic","vegan":"yes","tier":"context","why":"EFSA re-evaluated it in 2010 and set an ADI of 1.5 mg/kg bw/day, one of the lower ones. Another azo dye outside the Southampton six. Not permitted in the US.","adi":"1.5 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E160a","name":"Carotenes (beta-carotene)","aka":["carotene","carotenes","beta-carotene","beta carotene","mixed carotenes","e 160a"],"class":"Colour (yellow-orange)","job":"Orange-yellow in margarine, spreads, soft drinks, cheese and desserts. Also a vitamin A precursor.","origin":"Either extracted from carrots and algae, or synthesised — the label does not distinguish. Synthetic beta-carotene is chemically identical.","originType":"plant extract or synthetic","vegan":"yes","tier":"context","why":"As a food colour, unremarkable — EFSA set no numerical ADI for the mixed carotenes from natural sources. The reason it is worth a note: high-dose beta-carotene SUPPLEMENTS (20-30 mg a day) increased lung cancer in smokers and asbestos-exposed workers in two large trials, the ATBC and CARET studies, which is why EFSA advised keeping total intake from all sources below about 15 mg a day. Food-colour exposure is a tiny fraction of that. This is a supplement finding, not a food-colour one, and it is routinely misapplied to both.","adi":"No numerical ADI for natural mixed carotenes; EFSA advises total intake below ~15 mg/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E160c","name":"Paprika extract (capsanthin)","aka":["paprika extract","capsanthin","capsorubin","paprika oleoresin","e 160c"],"class":"Colour (orange-red)","job":"Red-orange in crisps, savoury snacks, sausages, sauces and ready meals. Very common in own-label snack ranges.","origin":"Solvent extract of red peppers.","originType":"plant extract","vegan":"yes","tier":"settled","why":"EFSA re-evaluated it in 2015 and set a group ADI of 1.7 mg carotenoids per kg bw/day — equivalently about 24 mg of the paprika extract itself — noting that high consumers of the relevant products could approach it. Concentrated pepper extract; nothing else to report.","adi":"Group ADI 1.7 mg carotenoids/kg bw/day (≈24 mg paprika extract/kg bw/day)","uk":"Permitted in GB and NI","refs":[]},{"code":"E160d","name":"Lycopene","aka":["lycopene","e 160d"],"class":"Colour (red)","job":"Red in soups, sauces, drinks and, increasingly, in plant-based meat products for a raw-mince appearance.","origin":"From tomatoes, or produced by fermentation with Blakeslea trispora mould, or synthesised.","originType":"plant extract, fermentation or synthetic","vegan":"yes","tier":"settled","why":"The pigment that makes tomatoes red; you eat far more of it from food than from the additive. EFSA set an ADI of 0.5 mg/kg bw/day and noted that high consumers could exceed it from all sources combined, mostly meaning tomato products.","adi":"0.5 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E161b","name":"Lutein","aka":["lutein","e 161b"],"class":"Colour (yellow)","job":"Yellow in drinks, desserts and dairy; also sold as an eye-health supplement.","origin":"Extracted from marigold flowers.","originType":"plant extract","vegan":"yes","tier":"settled","why":"EFSA set a group ADI of 1 mg/kg bw/day. A carotenoid found naturally in kale, spinach and egg yolk.","adi":"Group ADI 1 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E163","name":"Anthocyanins","aka":["anthocyanin","anthocyanins","e 163","grape skin extract","blackcurrant extract"],"class":"Colour (red/purple/blue)","job":"Red, purple and blue in drinks, yoghurts, sweets and desserts. The main natural replacement for the azo reds in UK reformulations.","origin":"Extracted from grape skins, blackcurrants, elderberries, red cabbage and purple carrot.","originType":"plant extract","vegan":"yes","tier":"settled","why":"The pigments in berries. EFSA re-evaluated them and raised no safety concern at reported use levels. Colour shifts with pH, which is why some products go grey when they should be pink.","adi":"No numerical ADI ('not specified') for most sources","uk":"Permitted in GB and NI","refs":[]},{"code":"E172","name":"Iron oxides and hydroxides","aka":["iron oxide","iron oxides","iron hydroxides","e 172"],"class":"Colour (red/yellow/black)","job":"Earth tones on confectionery coatings, cake decorations and some cheese rinds.","origin":"Synthesised mineral iron compounds.","originType":"mineral","vegan":"yes","tier":"settled","why":"Extremely poorly absorbed. EFSA re-evaluated it in 2015, set no numerical ADI, and asked for tighter specifications on particle size — a recurring theme for mineral colours but not a finding of harm.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E170","name":"Calcium carbonate (as an additive)","aka":["calcium carbonate","chalk","e 170"],"class":"Colour / anti-caking agent / firming agent / acidity regulator","job":"Whitens, firms tinned vegetables, stops powders caking, and supplies calcium. Also the mandatory fortificant in UK white flour.","origin":"Limestone or chalk, purified. Chemically the same as the calcium in your bones and in an indigestion tablet.","originType":"mineral","vegan":"yes","tier":"settled","why":"Chalk. EFSA set no numerical ADI. If you see it on a bread label it is there because the law requires it.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI; required in non-wholemeal wheat flour","refs":[]},{"code":"E385","name":"Calcium disodium EDTA","aka":["calcium disodium edta","edta","disodium edta","e 385"],"class":"Sequestrant / preservative","job":"Locks up trace metals that would otherwise turn oils rancid or fade colour. Common in mayonnaise, salad dressings, tinned pulses, tinned fish and some canned vegetables.","origin":"Synthetic chelating agent.","originType":"synthetic","vegan":"yes","tier":"context","why":"The ADI of 2.5 mg/kg bw/day is an old one, set by JECFA in 1974 and the EU's Scientific Committee for Food in 1977. EFSA has still not re-evaluated it — its call for data closed at the end of 2024 and the opinion is pending — so this is an additive running on fifty-year-old paperwork rather than one with a modern signal against it. Preliminary exposure estimates sit below the ADI. The theoretical concern is that a chelator binds minerals indiscriminately, so very high intakes could affect zinc and iron status; that has not been shown at food levels. Worth knowing mainly because the re-evaluation is outstanding.","adi":"2.5 mg/kg bw/day (JECFA 1974 / SCF 1977; EFSA re-evaluation pending)","uk":"Permitted in GB and NI with restrictions on which foods","refs":[]},{"code":"E392","name":"Extracts of rosemary","aka":["extracts of rosemary","rosemary extract","e 392"],"class":"Antioxidant","job":"Stops fats going rancid in crisps, sauces, meat products and ready meals. The clean-label replacement for BHA and BHT, and now very common in own-label ranges.","origin":"Solvent extract of rosemary leaves, concentrated for its carnosic acid and carnosol.","originType":"plant extract","vegan":"yes","tier":"settled","why":"The working figure is a TEMPORARY ADI of 0.3 mg/kg bw/day expressed as carnosol plus carnosic acid, set by JECFA and used by EFSA in its 2018 exposure assessment, which found intakes below it. It is a concentrated herb extract rather than a herb, which is why it gets an E-number at all — but the toxicology is unremarkable and it displaces two synthetic antioxidants with lower ADIs.","adi":"Temporary ADI 0.3 mg/kg bw/day as carnosol + carnosic acid (JECFA; used in EFSA's 2018 exposure assessment)","uk":"Permitted in GB and NI","refs":[]},{"code":"E310","name":"Gallates (propyl, octyl, dodecyl — E310-E312)","aka":["propyl gallate","octyl gallate","dodecyl gallate","gallates","e 310","e 311","e 312"],"class":"Antioxidant","job":"Prevents rancidity in fats, oils, stock cubes, dried soups and chewing gum. Increasingly displaced by rosemary extract and tocopherols.","origin":"Synthetic esters of gallic acid.","originType":"synthetic","vegan":"yes","tier":"unsettled","why":"EFSA re-evaluated propyl gallate in 2014 and cut the ADI from 1.4 to 0.5 mg/kg bw/day, and could not conclude on octyl and dodecyl gallate at all because the toxicological data were inadequate — those two were subsequently removed from the authorised list. Propyl gallate can also trigger reactions in a small number of people with existing sensitivities. Real exposure is low, but a regulator halving an ADI and declining to assess two of the three group members is a fair reason to keep this out of the 'settled' bucket.","adi":"Propyl gallate 0.5 mg/kg bw/day (EFSA 2014, reduced)","uk":"Propyl gallate permitted in GB and NI; octyl and dodecyl gallate no longer authorised","refs":[]},{"code":"E315","name":"Erythorbic acid and sodium erythorbate (E315, E316)","aka":["erythorbic acid","sodium erythorbate","e 315","e 316","isoascorbic acid"],"class":"Antioxidant","job":"Almost exclusively used in cured meat and fish, where it speeds up curing and — importantly — suppresses the formation of nitrosamines from nitrite.","origin":"Synthetic isomer of vitamin C, made by fermentation. It has the antioxidant activity of vitamin C but essentially none of the vitamin activity.","originType":"fermentation","vegan":"yes","tier":"settled","why":"EFSA set an ADI of 6 mg/kg bw/day. It is one of the few additives whose presence in cured meat is actively protective — like ascorbate, it reduces the nitrosamine formation that is the actual concern with nitrite.","adi":"6 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E280","name":"Propionic acid and propionates (E280-E283)","aka":["propionic acid","calcium propionate","sodium propionate","potassium propionate","e 280","e 281","e 282","e 283"],"class":"Preservative","job":"The mould inhibitor in packaged bread, part-baked bread, wraps, crumpets and some cakes. It is what gives a supermarket loaf a week of shelf life instead of two days.","origin":"Synthetic, though propionic acid occurs naturally in Swiss cheese and in the human gut, where bacteria make it from fibre.","originType":"synthetic","vegan":"yes","tier":"context","why":"EFSA re-evaluated propionates in 2014 and found no safety concern at reported use levels — but note the precise wording: the database did not allow an ADI to be allocated at all, which is not the same as the reassuring 'no numerical ADI needed' you see for citric acid. Propionate is a normal product of fibre fermentation in your own colon. A small mouse study and some low-quality human work have been used to link it to insulin resistance; EFSA did not find that persuasive. The more useful reading is as a marker: E282 on a loaf means industrial shelf life. Sourdough achieves the same effect with the acids the fermentation makes.","adi":"No ADI allocated — EFSA 2014 found the database insufficient, while concluding no concern at reported uses","uk":"Permitted in GB and NI, mainly in bread and baked goods","refs":[]},{"code":"E234","name":"Nisin","aka":["nisin","e 234"],"class":"Preservative","job":"A natural antibacterial used in processed cheese, clotted cream, semolina and tapioca puddings.","origin":"A peptide produced by Lactococcus lactis, the same bacterium used to make cheese.","originType":"microbial fermentation","vegan":"yes","tier":"settled","why":"Digested as a protein. EFSA re-evaluated it in 2017 and set an ADI of 1 mg/kg bw/day, with exposure well below it. There is a theoretical question about whether bacteriocin use could select for resistance, but no evidence of clinical relevance.","adi":"1 mg/kg bw/day","uk":"Permitted in GB and NI in specified foods","refs":[]},{"code":"E235","name":"Natamycin (pimaricin)","aka":["natamycin","pimaricin","e 235"],"class":"Preservative","job":"Surface treatment on hard cheese rinds and dried sausage skins to stop mould. Only allowed on the outside, not through the food.","origin":"Produced by fermentation with Streptomyces natalensis.","originType":"microbial fermentation","vegan":"yes","tier":"context","why":"It is an antifungal drug that is also used medically, which is the legitimate reason to know about it: the concern is resistance selection rather than toxicity. The working ADI of 0.3 mg/kg bw/day comes from JECFA — when EFSA looked at it in 2009 it found the data insufficient to derive one of its own. Because it is a surface treatment (permitted only on the outer 5 mm of semi-hard cheese and dried cured sausage), cutting the rind off removes essentially all of it, and rinds treated this way are not meant to be eaten.","adi":"0.3 mg/kg bw/day (JECFA; EFSA 2009 found data insufficient to set one)","uk":"Permitted in GB and NI for surface treatment only, outer 5 mm","refs":[]},{"code":"E260","name":"Acetic acid and acetates (E260, E261, E263)","aka":["acetic acid","potassium acetate","calcium acetate","e 260","e 261","e 263"],"class":"Acidity regulator / preservative","job":"Acidity and mild preservation in sauces, pickles, dressings and breads.","origin":"Acetic acid is vinegar. Made by fermentation or synthesis.","originType":"fermentation or synthetic","vegan":"yes","tier":"settled","why":"Vinegar and its salts. EFSA set no numerical ADI. Nothing to say.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E270","name":"Lactic acid","aka":["lactic acid","e 270","sodium lactate","potassium lactate","e 325","e 326","e 327","calcium lactate"],"class":"Acidity regulator / preservative","job":"Sourness and shelf life in sauces, dressings, ready meals, sliced meats and sourdough-style breads.","origin":"Almost always made by bacterial fermentation of sugar. Despite the name it is not from milk, and food-grade lactic acid is normally vegan — though it can in principle be produced on a dairy substrate.","originType":"microbial fermentation","vegan":"yes","tier":"settled","why":"Your own muscles make it. EFSA set no numerical ADI. The only genuine caution is that lactic acid is not used in infant food because young babies handle the D-isomer poorly.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E296","name":"Malic acid","aka":["malic acid","e 296","e 297","fumaric acid","sodium malate","e 350"],"class":"Acidity regulator","job":"Sharp apple-like sourness in sweets, drinks, tinned fruit and low-sugar products.","origin":"Synthesised, or extracted from fruit. It is the acid that makes green apples sour.","originType":"synthetic or plant","vegan":"yes","tier":"settled","why":"A normal intermediate of human metabolism. No numerical ADI. Not used in infant foods for the same isomer reason as lactic acid.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E334","name":"Tartaric acid and tartrates (E334-E337, E354)","aka":["tartaric acid","tartrates","sodium tartrate","potassium tartrate","cream of tartar","e 334","e 335","e 336","e 337"],"class":"Acidity regulator / raising agent","job":"Sourness in confectionery and drinks; cream of tartar is the acid half of baking powder.","origin":"A by-product of winemaking — recovered from the crystals that form in wine casks.","originType":"plant (grape)","vegan":"yes","tier":"settled","why":"EFSA re-evaluated tartrates in 2020 and set a group ADI of 240 mg/kg bw/day, far above real intake. Long history, no concerns.","adi":"Group ADI 240 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E575","name":"Glucono-delta-lactone (GDL)","aka":["glucono-delta-lactone","glucono delta lactone","gdl","e 575","sodium gluconate","e 576","gluconic acid","e 574"],"class":"Acidity regulator / raising agent","job":"A slow-release acid. In fresh sausages and cured salami it drops the pH gradually to firm the texture and help preservation; it is also the coagulant in silken tofu, and a raising-agent acid in bakery.","origin":"Made by fermenting glucose.","originType":"microbial fermentation","vegan":"yes","tier":"settled","why":"Hydrolyses to gluconic acid, which is metabolised normally. EFSA set no numerical ADI. Its appearance on a sausage label often means the product was acidified quickly instead of being fermented slowly — a processing tell rather than a health one.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E472a","name":"Acetic acid esters of mono- and diglycerides (ACETEM)","aka":["acetic acid esters of mono- and diglycerides of fatty acids","acetem","e 472a"],"class":"Emulsifier","job":"Forms flexible edible films and aerates fats — used in whipped toppings, coatings and some bakery fats.","origin":"Mono/diglycerides (plant oil or animal fat) esterified with acetic acid.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"context","why":"No numerical ADI and no specific health signal, including in the NutriNet-Sante emulsifier analyses where it did not stand out. Flagged only for undeclared origin.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E473","name":"Sucrose esters of fatty acids","aka":["sucrose esters of fatty acids","sucrose esters","e 473","e 474","sucroglycerides"],"class":"Emulsifier","job":"Emulsifies in coffee whiteners, some drinks, bakery and — a specifically British use — as part of the coating that keeps waxed fruit shiny.","origin":"Sugar esterified with fatty acids from plant oils or animal fats.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"context","why":"Group ADI of 40 mg/kg bw/day, shared with sucroglycerides (E474), set by EFSA in 2004. Unremarkable — it is digested into sugar and fat. Origin of the fatty acids is not declared.","adi":"Group ADI 40 mg/kg bw/day (with E474)","uk":"Permitted in GB and NI","refs":[]},{"code":"E475","name":"Polyglycerol esters of fatty acids","aka":["polyglycerol esters of fatty acids","polyglycerol esters","e 475"],"class":"Emulsifier","job":"Aeration and crumb softening in cakes, sponge mixes and whipped toppings.","origin":"Glycerol polymerised and esterified with fatty acids from plant oil or animal fat.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"context","why":"EFSA re-evaluated it in 2017 and concluded there was no need for a numerical ADI at all — the old figure of 25 mg/kg bw/day was a pre-EFSA committee value that has since been superseded. No cohort signal of its own. Origin flag.","adi":"No numerical ADI needed (EFSA 2017)","uk":"Permitted in GB and NI","refs":[]},{"code":"E477","name":"Propane-1,2-diol esters of fatty acids (PGMS)","aka":["propane-1,2-diol esters of fatty acids","propylene glycol esters","pgms","e 477","propylene glycol","e 1520"],"class":"Emulsifier / humectant","job":"Whipping aid in dessert toppings and cake emulsifiers. Propylene glycol itself (E1520) is a carrier for flavourings and colours.","origin":"Propylene glycol esterified with fatty acids. Propylene glycol is a synthetic petrochemical-derived solvent.","originType":"synthetic + variable fatty acids","vegan":"check","tier":"context","why":"The name alarms people because propylene glycol appears in antifreeze — but the toxic antifreeze compound is ethylene glycol, a different substance. The ADI is 25 mg/kg bw/day expressed as propane-1,2-diol, which works out at about 80 mg/kg bw/day of E477 itself. Exposure sits below it. Not a serious concern; a persistent internet myth.","adi":"25 mg/kg bw/day as propane-1,2-diol (≈80 mg/kg bw/day of E477)","uk":"Permitted in GB and NI","refs":[]},{"code":"E432","name":"Polysorbates 20, 60 and 65 (E432, E435, E436)","aka":["polysorbate 20","polysorbate 60","polysorbate 65","polyoxyethylene sorbitan monolaurate","e 432","e 434","e 435","e 436"],"class":"Emulsifier","job":"Emulsify and stabilise foams in ice cream, cake toppings, coffee whiteners and some sauces.","origin":"Synthetic — sorbitol reacted with ethylene oxide and fatty acids.","originType":"synthetic","vegan":"check","tier":"unsettled","why":"EFSA set a group ADI of 25 mg/kg bw/day in 2015 and — this is the point — estimated that high-consuming toddlers reach about 24.5 mg/kg bw/day, essentially at the ADI. That is an unusually thin margin. They also belong to the same detergent-like emulsifier family as polysorbate 80, the compound implicated in the mouse gut-barrier studies. No human harm demonstrated.","adi":"Group ADI 25 mg/kg bw/day — toddler high-level exposure estimated at ~24.5","uk":"Permitted in GB and NI","refs":[]},{"code":"E491","name":"Sorbitan esters (E491-E495)","aka":["sorbitan monostearate","sorbitan tristearate","sorbitan monolaurate","sorbitan monooleate","sorbitan esters","e 491","e 492","e 493","e 494","e 495"],"class":"Emulsifier","job":"Controls fat crystallisation — stops chocolate blooming, keeps icing glossy, aerates cake mixes. Often paired with a polysorbate.","origin":"Sorbitol esterified with fatty acids from plant oil or animal fat.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"context","why":"EFSA re-evaluated these in 2017 and set a group ADI of 10 mg/kg bw/day expressed as sorbitan, with exposure below it. Origin of the fatty acids is undeclared.","adi":"Group ADI 10 mg/kg bw/day expressed as sorbitan","uk":"Permitted in GB and NI","refs":[]},{"code":"E470a","name":"Fatty acid salts (E470a, E470b) and stearic acid (E570)","aka":["sodium salts of fatty acids","magnesium salts of fatty acids","magnesium stearate","calcium stearate","stearic acid","e 470a","e 470b","e 570"],"class":"Anti-caking agent / emulsifier / glazing agent","job":"Stops powders and tablets sticking; used in sugar confectionery, powdered drinks and as a release agent.","origin":"Fatty acids from plant oils or animal fats, combined with sodium, magnesium or calcium.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"context","why":"Digested as ordinary fat. No numerical ADI and no health question at these levels. Purely an origin flag — magnesium stearate in particular is very often animal-derived in supplements, less so in food.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E551","name":"Silicon dioxide (silica)","aka":["silicon dioxide","silica","e 551","amorphous silica"],"class":"Anti-caking agent","job":"Keeps powders flowing — grated cheese, powdered drinks, seasoning blends, supplements, salt.","origin":"Synthesised amorphous silica. Chemically it is what sand is made of, but in a fine, porous, non-crystalline form.","originType":"mineral / synthetic","vegan":"yes","tier":"context","why":"A good example of an open question actually getting closed. EFSA's 2018 re-evaluation could NOT confirm the old 'no ADI needed' position: it found the toxicological database inadequate and flagged that the additive contains nanoscale particles not covered by the specifications. That put it under a cloud for six years. EFSA completed the follow-up in 2024 using a margin-of-exposure approach and found NO safety concern for any age group, including infants under 16 weeks, alongside tightened specifications for lead, mercury, arsenic and aluminium. Separately: crystalline silica is a known lung carcinogen when inhaled industrially — different material, different route, not what is in your grated cheese.","adi":"No ADI; EFSA's 2024 follow-up used margin-of-exposure and found no safety concern","uk":"Permitted in GB and NI","refs":[{"t":"EFSA re-evaluation of silicon dioxide (2018)","u":"https://www.efsa.europa.eu/en/efsajournal/pub/5088"}]},{"code":"E552","name":"Calcium silicate and magnesium silicates (E552-E553)","aka":["calcium silicate","magnesium silicate","magnesium trisilicate","talc","e 552","e 553a","e 553b"],"class":"Anti-caking agent","job":"Free-flow agents in salt, seasonings, powdered products; talc (E553b) also glazes rice and coats chewing gum.","origin":"Mined mineral silicates.","originType":"mineral","vegan":"yes","tier":"unsettled","why":"Not absorbed, and no dietary harm has been shown. But talc carries a genuine open question: IARC classifies talc as probably carcinogenic to humans (Group 2A, reclassified in 2024) on the basis of ovarian cancer studies in people using talcum powder and mesothelioma from occupational inhalation. Those are different routes of exposure from eating a grain of it on rice, and EFSA has not restricted the food use. Worth knowing that the classification exists rather than discovering it in a headline.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI for specified uses","refs":[]},{"code":"E535","name":"Ferrocyanides (E535, E536, E538)","aka":["sodium ferrocyanide","potassium ferrocyanide","calcium ferrocyanide","ferrocyanides","e 535","e 536","e 538"],"class":"Anti-caking agent","job":"Stops table salt caking. Essentially its only use.","origin":"Synthetic iron-cyanide complexes.","originType":"synthetic","vegan":"yes","tier":"settled","why":"The word 'cyanide' does the heavy lifting here and it is misleading: the cyanide is locked into an extremely stable iron complex that does not release free cyanide under digestion. EFSA re-evaluated them in 2018 and set a group ADI of 0.03 mg/kg bw/day, finding exposure below it. Used at a few tens of milligrams per kilo of salt.","adi":"Group ADI 0.03 mg/kg bw/day","uk":"Permitted in GB and NI, in salt and salt substitutes","refs":[]},{"code":"E500","name":"Sodium carbonates (bicarbonate of soda)","aka":["sodium carbonate","sodium bicarbonate","sodium hydrogen carbonate","bicarbonate of soda","baking soda","e 500","e 501","potassium carbonate","e 503","ammonium carbonate","e 504","magnesium carbonate"],"class":"Raising agent / acidity regulator / anti-caking agent","job":"Makes cakes, scones and biscuits rise; regulates acidity; keeps powders dry.","origin":"Mined or manufactured mineral salts.","originType":"mineral","vegan":"yes","tier":"settled","why":"Bicarb. No numerical ADI. The only thing worth noting is that sodium bicarbonate contributes sodium, which counts towards salt intake even though it does not taste salty.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E508","name":"Potassium chloride","aka":["potassium chloride","e 508","potassium salt","e 509","calcium chloride","e 511","magnesium chloride"],"class":"Salt substitute / firming agent / stabiliser","job":"The main way manufacturers cut sodium while keeping food tasting salty. Increasingly common in own-label reduced-salt bread, crisps, soups, ready meals and 'reduced sodium' salts. Calcium and magnesium chloride firm tinned vegetables and coagulate tofu.","origin":"Mined mineral salt.","originType":"mineral","vegan":"yes","tier":"context","why":"For most people this is a straightforwardly good swap — replacing sodium with potassium lowers blood pressure on both counts, and trials of potassium-enriched salt have shown reduced stroke risk. The exception matters though: people with chronic kidney disease, or taking ACE inhibitors, ARBs or potassium-sparing diuretics, cannot clear potassium normally and are advised to avoid potassium-based salt substitutes. It also tastes metallic-bitter at higher levels, which is why it is usually blended rather than used alone.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E516","name":"Calcium sulphate (gypsum)","aka":["calcium sulphate","calcium sulfate","gypsum","e 516","e 517","ammonium sulphate"],"class":"Firming agent / flour treatment / yeast nutrient","job":"Coagulates firm tofu, firms tinned vegetables, and — as ammonium sulphate (E517) — feeds the yeast in industrial bread dough so it rises faster.","origin":"Mined mineral.","originType":"mineral","vegan":"yes","tier":"settled","why":"Gypsum. No numerical ADI, no safety question. If you eat firm tofu, this is what set it (the alternative is nigari, magnesium chloride). E517 on a bread label is another marker of the fast industrial process.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E524","name":"Sodium hydroxide and other alkalis (E524-E528)","aka":["sodium hydroxide","potassium hydroxide","calcium hydroxide","e 524","e 525","e 526","e 527","e 528"],"class":"Acidity regulator","job":"Adjusts pH. Used in cocoa processing ('Dutched' cocoa), olives, and pretzel making.","origin":"Manufactured caustic alkalis.","originType":"synthetic","vegan":"yes","tier":"settled","why":"Caustic in the bottle, entirely neutralised in the finished food — it is consumed by the reaction it is added for. No numerical ADI. Alkalised cocoa does lose some flavanols, which is a nutritional footnote rather than a safety one.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E903","name":"Carnauba wax","aka":["carnauba wax","e 903","candelilla wax","e 902"],"class":"Glazing agent","job":"The shine on chocolate beans, jelly sweets, coated nuts and fresh citrus and apples. The vegan alternative to shellac and beeswax.","origin":"Wax from the leaves of the Brazilian carnauba palm. Candelilla wax is from a Mexican shrub.","originType":"plant","vegan":"yes","tier":"settled","why":"Not absorbed. The working ADI of 7 mg/kg bw/day is JECFA's; EFSA looked at it in 2012, declined to set its own ADI because the long-term data were lacking, but found no safety concern at reported use levels. Good news if you are checking for animal glazes — if the label says carnauba rather than shellac or beeswax, it is plant-based.","adi":"7 mg/kg bw/day (JECFA); EFSA 2012 set none but found no concern at reported uses","uk":"Permitted in GB and NI","refs":[]},{"code":"E999","name":"Quillaia extract","aka":["quillaia extract","quillaja extract","e 999"],"class":"Foaming agent","job":"Makes the head on ginger beer, cream soda and some cocktail mixers.","origin":"Bark extract of the South American soapbark tree, rich in saponins.","originType":"plant extract","vegan":"yes","tier":"settled","why":"EFSA re-evaluated it in 2019 and set an ADI of 3 mg/kg bw/day expressed as saponins, with exposure below it except in very high consumers of the relevant drinks. Saponins are also what makes soaking beans produce foam.","adi":"3 mg/kg bw/day (as saponins)","uk":"Permitted in GB and NI, mainly in water-based flavoured drinks","refs":[]},{"code":"E445","name":"Glycerol esters of wood rosin","aka":["glycerol esters of wood rosin","ester gum","e 445"],"class":"Emulsifier / weighting agent","job":"Keeps citrus flavour oils evenly dispersed in cloudy soft drinks so they do not float to the top as a ring.","origin":"Pine tree rosin, esterified with glycerol.","originType":"plant (tree resin)","vegan":"yes","tier":"context","why":"EFSA's 2023 follow-up converted an earlier temporary figure into a full ADI of 10 mg/kg bw/day. It replaced brominated vegetable oil, which did the same job, was banned in the EU decades ago, and was finally revoked by the US FDA in July 2024. So its presence is a reformulation success story, not a warning sign — but it is a striking example of how far from 'food' a functional ingredient can be.","adi":"10 mg/kg bw/day (EFSA 2023, replacing an earlier temporary ADI)","uk":"Permitted in GB and NI, restricted to specified drinks","refs":[]},{"code":"E405","name":"Propane-1,2-diol alginate (PGA)","aka":["propane-1,2-diol alginate","propylene glycol alginate","e 405","e 402","potassium alginate","e 403","ammonium alginate","e 404","calcium alginate"],"class":"Thickener / stabiliser / foam stabiliser","job":"Holds the head on beer, thickens dressings and sauces that need to survive acidity.","origin":"Brown seaweed alginate, reacted with propylene oxide.","originType":"seaweed extract, chemically modified","vegan":"yes","tier":"settled","why":"EFSA re-evaluated propane-1,2-diol alginate in 2018 and set an ADI of 55 mg/kg bw/day, with exposure below it. Not absorbed.","adi":"55 mg/kg bw/day (EFSA 2018)","uk":"Permitted in GB and NI","refs":[]},{"code":"E425","name":"Konjac gum / glucomannan","aka":["konjac","konjac gum","konjac glucomannan","glucomannan","e 425"],"class":"Thickener / gelling agent","job":"Gels and thickens; the basis of konjac 'zero-calorie' noodles and rice, and used in some vegan seafood alternatives.","origin":"Flour from the corm of the konjac plant.","originType":"plant (tuber)","vegan":"yes","tier":"context","why":"A non-absorbed soluble fibre with a real satiety effect — the EU permits a weight-management health claim for glucomannan. The flag is physical, not toxicological: konjac swells dramatically in water and has caused fatal choking, which is why konjac jelly mini-cups are BANNED in the UK and EU. Konjac noodles and powders remain permitted. Anyone with swallowing difficulties should treat konjac supplements with care and take them with plenty of water.","adi":"No numerical ADI; jelly mini-cup format prohibited","uk":"Permitted in GB and NI; prohibited in jelly mini-cups","refs":[]},{"code":"E417","name":"Tara gum, tragacanth and karaya (E413, E416, E417)","aka":["tara gum","tragacanth","gum tragacanth","karaya gum","e 413","e 416","e 417"],"class":"Thickener / stabiliser","job":"Minor thickeners used where guar or locust bean gum will not do — dressings, fillings, some dairy.","origin":"Plant seed endosperm (tara) or tree exudates (tragacanth, karaya).","originType":"plant","vegan":"yes","tier":"settled","why":"Non-absorbed plant polysaccharides with no safety concern at use levels. Tara gum did have a supply-chain scare in the US in 2024 when an unapproved, differently-processed tara flour was linked to illness in a meal-kit product — that was a different ingredient, not the food additive.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E1200","name":"Polydextrose","aka":["polydextrose","e 1200"],"class":"Bulking agent / fibre","job":"Adds bulk and declarable fibre while replacing sugar in reduced-sugar biscuits, bars, ice cream and drinks.","origin":"Glucose polymerised with a small amount of sorbitol and citric acid.","originType":"plant sugar, chemically polymerised","vegan":"yes","tier":"context","why":"Only partly fermented and largely unabsorbed, so it behaves like a soluble fibre. No numerical ADI. The flag is the same as for the polyols and inulin: above about 90 g a day it is frankly laxative, and at the levels needed to make a fibre claim it causes bloating in plenty of people. A 'high fibre, low sugar' bar that leaves you uncomfortable is usually this or chicory root.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E459","name":"Beta-cyclodextrin","aka":["beta-cyclodextrin","cyclodextrin","e 459"],"class":"Carrier / stabiliser","job":"A molecular cage that traps and protects flavour compounds, or masks bitterness. Used in flavour and vitamin powders and some chewing gum.","origin":"Made enzymatically from starch.","originType":"plant starch, enzymatically modified","vegan":"yes","tier":"settled","why":"EFSA set an ADI of 5 mg/kg bw/day. Poorly absorbed and fermented in the colon.","adi":"5 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E1505","name":"Triethyl citrate and glyceryl triacetate (E1505, E1518)","aka":["triethyl citrate","glyceryl triacetate","triacetin","e 1505","e 1518"],"class":"Carrier / humectant","job":"Solvents and carriers for flavourings; triethyl citrate also stabilises the foam in dried egg white.","origin":"Citric acid or glycerol esterified with alcohol or acetic acid.","originType":"synthetic from fermentation feedstocks","vegan":"yes","tier":"settled","why":"Hydrolysed to citrate or glycerol and acetate, all normal metabolites. The ADI of 20 mg/kg bw/day for triethyl citrate is JECFA's; EFSA has not published a re-evaluation. Low exposure.","adi":"20 mg/kg bw/day for E1505 (JECFA; no EFSA re-evaluation published)","uk":"Permitted in GB and NI","refs":[]},{"code":"E1103","name":"Invertase","aka":["invertase","e 1103"],"class":"Enzyme (stabiliser)","job":"Splits sucrose into glucose and fructose. It is what turns a solid fondant centre liquid inside a chocolate after a few days.","origin":"Produced by yeast fermentation.","originType":"microbial fermentation","vegan":"yes","tier":"settled","why":"An enzyme, digested as protein. No safety concern. Included because it is one of very few enzymes that gets an E-number at all — most enzymes in food are processing aids and never appear on the label.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E640","name":"Glycine and its sodium salt","aka":["glycine","sodium glycinate","e 640"],"class":"Flavour enhancer","job":"Mild sweet-savoury enhancer, sometimes used to round off the taste of sweeteners.","origin":"The simplest amino acid, made synthetically or by fermentation.","originType":"synthetic or fermentation","vegan":"yes","tier":"settled","why":"An amino acid you make yourself and eat in every protein-containing food. No numerical ADI, no concern.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E952","name":"Cyclamate (cyclamic acid and its salts)","aka":["cyclamate","cyclamic acid","sodium cyclamate","calcium cyclamate","e 952"],"class":"Sweetener","job":"Bulk-ish intense sweetener, about 30-50 times sugar, almost always blended with saccharin or acesulfame K. Common in continental European own-label squashes, sugar-free drinks and tabletop sweeteners — so you meet it more often in Lidl's ranges than in a typical British brand.","origin":"Synthetic.","originType":"synthetic","vegan":"yes","tier":"context","why":"The most jurisdictionally awkward sweetener on the shelf. It has been BANNED in the United States since 1970 after a rat study linked a cyclamate-saccharin mixture to bladder tumours; that study was later judged not relevant to humans, and repeated reviews since have not confirmed a cancer risk. The EU and UK permit it with an ADI of 7 mg/kg bw/day, one of the lowest of any sweetener. Intake assessments have screened it out as not of concern for adults or children, with only a narrow margin for very high consumers in one non-representative survey — so the honest reading is: probably not carcinogenic, low ADI, exposure fine, and still banned in a major jurisdiction fifty years on. The disagreement is regulatory history, not current evidence.","adi":"7 mg/kg bw/day (SCF 2000)","uk":"Permitted in GB and NI. Banned in the United States.","refs":[]},{"code":"E954","name":"Saccharin","aka":["saccharin","sodium saccharin","e 954"],"class":"Sweetener","job":"The oldest artificial sweetener, ~300-500 times sugar, with a metallic aftertaste that is why it is usually blended. Tabletop sweeteners, squashes, some sugar-free products.","origin":"Synthetic.","originType":"synthetic","vegan":"yes","tier":"context","why":"A cautionary tale about how these scares age. Saccharin carried a cancer warning label in the US for over 20 years on the strength of bladder tumours in male rats — an effect later shown to depend on a rat-specific urinary protein that humans do not produce. The US removed it from the carcinogen list in 2000 and dropped the warning label. EFSA re-evaluated saccharins in 2024 and raised the ADI from 5 to 9 mg/kg bw/day, having found no genotoxicity or carcinogenicity concern. Good example of an additive that got LESS worrying with better data.","adi":"9 mg/kg bw/day (EFSA 2024, raised from 5)","uk":"Permitted in GB and NI","refs":[]},{"code":"E962","name":"Aspartame-acesulfame salt","aka":["aspartame-acesulfame salt","e 962"],"class":"Sweetener","job":"A single salt combining aspartame and acesulfame K, used where a blend is wanted without declaring two additives.","origin":"Synthetic.","originType":"synthetic","vegan":"yes","tier":"unsettled","why":"Dissociates into aspartame and acesulfame K in the body, so it carries both of their question marks — the 2023 IARC 'possibly carcinogenic' hazard classification for aspartame and the acesulfame K cohort signal — and both of their reassurances. Also carries the phenylalanine warning for people with PKU.","adi":"Counted against the individual ADIs for aspartame (40) and acesulfame K (9) mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E961","name":"Neotame and advantame (E961, E969)","aka":["neotame","advantame","e 961","e 969"],"class":"Sweetener","job":"Extremely intense sweeteners — neotame is about 8,000 times sugar, advantame about 20,000 — so they are used at microgram levels, mostly in drinks and chewing gum.","origin":"Synthetic derivatives of aspartame.","originType":"synthetic","vegan":"yes","tier":"context","why":"Because the use levels are so tiny, exposure sits far below the ADIs. EFSA re-evaluated neotame in 2025 and RAISED its ADI from 2 to 10 mg/kg bw/day; advantame sits at 5 mg/kg bw/day. Unlike aspartame they do not release meaningful phenylalanine, so no PKU warning is needed. A 2024 in-vitro study reported neotame affected gut barrier cells; it is cell-culture work at concentrations well above realistic exposure and has not changed any regulatory position.","adi":"Neotame 10 mg/kg bw/day (EFSA 2025, raised from 2); advantame 5 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E959","name":"Neohesperidine DC","aka":["neohesperidine dc","neohesperidin dihydrochalcone","e 959"],"class":"Sweetener / flavour enhancer","job":"Sweetener with a lingering liquorice note, mostly used at low levels to mask bitterness rather than to sweeten outright.","origin":"Derived from citrus peel flavonoids.","originType":"plant-derived, chemically modified","vegan":"yes","tier":"settled","why":"EFSA re-evaluated it in 2022 and RAISED the ADI from 5 to 20 mg/kg bw/day, with exposure well below it. Low use levels, no signals.","adi":"20 mg/kg bw/day (EFSA 2022, raised from 5)","uk":"Permitted in GB and NI","refs":[]},{"code":"E242","name":"Dimethyl dicarbonate","aka":["dimethyl dicarbonate","dmdc","e 242"],"class":"Preservative","job":"A cold sterilant added to bottled soft drinks, flavoured waters, iced teas and some wines at filling to kill residual yeasts.","origin":"Synthetic.","originType":"synthetic","vegan":"yes","tier":"settled","why":"It hydrolyses completely within hours into methanol and carbon dioxide, so none of the additive itself is in the drink you buy. The methanol produced is a fraction of what is naturally present in fruit juice. It also forms small amounts of methyl carbamate and related carbonates by reacting with other drink components — EFSA looked at these in its 2015 re-evaluation and still found no safety concern at the permitted maximum. It appears on labels but is functionally gone by the time you drink it.","adi":"No numerical ADI; use limited to 250 mg/l, entirely decomposed before consumption","uk":"Permitted in GB and NI for specified drinks","refs":[]},{"code":"—","name":"Fermented wheat flour / cultured dextrose / cultured wheat","aka":["fermented wheat flour","cultured dextrose","cultured wheat","cultured wheat flour","fermented flour","cultured corn syrup","fermented rice flour"],"class":"Clean-label preservative","job":"Does exactly the job of calcium propionate — inhibits mould in bread, wraps and cakes — but because it is a fermented food ingredient rather than a purified chemical, it is declared as an ingredient with no E-number and no 'preservative' class word. Heavily used by M&S and in premium own-label bakery.","origin":"Wheat flour or dextrose fermented with propionibacteria, which produce propionic acid in situ. The active molecule is the same one that is in E280-E283.","originType":"microbial fermentation","vegan":"yes","tier":"context","why":"This is the single clearest example of clean-label engineering on a British shelf, and the honest reading cuts both ways. It is not a con — it really is a fermented ingredient and it works. But the preservative effect comes from propionic acid, the identical substance you would be flagging if it appeared as E282. A label with 'fermented wheat flour' and one with 'preservative: calcium propionate' are doing the same thing; only one of them looks artificial. If you are avoiding preservatives on principle, this is the entry that should make you decide whether the principle is about the molecule or about the word.","adi":"Not applicable — declared as an ingredient","uk":"Permitted as an ingredient; no additive declaration required","refs":[]},{"code":"—","name":"Celery juice powder / celery extract (in 'nitrite-free' cured meat)","aka":["celery juice powder","celery powder","celery extract","celery concentrate","vegetable juice powder","swiss chard powder"],"class":"Clean-label curing agent","job":"Cures bacon, ham and salami in products marketed as free from added nitrites. Celery is naturally very high in nitrate; a starter culture converts it to nitrite in the meat, which then does exactly what E250 does.","origin":"Concentrated celery juice, plus a bacterial culture.","originType":"plant concentrate","vegan":"yes","tier":"context","why":"Chemically this is not nitrite-free curing, it is nitrite curing by another route, and the resulting nitrite levels are often comparable to conventionally cured meat. The EU tightened its rules in the 2023 nitrite regulation partly to close this gap. Two genuine caveats in the other direction: the vegetable concentrate brings vitamin C and polyphenols that suppress nitrosamine formation, and the total is at least now capped. But if you switched to 'no added nitrites' bacon believing you had removed the nitrite, you have mostly changed the sourcing. It is also a real problem for people with celery allergy, which is one of the 14 declarable UK allergens.","adi":"Contributes to the same nitrite exposure as E249-E250","uk":"Permitted as an ingredient; celery must be declared as an allergen","refs":[]},{"code":"—","name":"Wheat gluten / vital wheat gluten / seitan","aka":["wheat gluten","vital wheat gluten","seitan","wheat protein"],"class":"Protein ingredient","job":"The chewy protein backbone of many meat alternatives and a dough strengthener in industrial bread — added gluten lets a bakery use cheaper, lower-protein flour and still get a good rise.","origin":"Wheat flour washed to remove the starch, leaving the protein.","originType":"plant, fractionated","vegan":"yes","tier":"context","why":"For the roughly 99% of people without coeliac disease or wheat allergy, there is no evidence that gluten is harmful, and 'non-coeliac gluten sensitivity' trials more often implicate fructans than gluten itself. Two things are still worth knowing: added vital wheat gluten pushes the gluten content of industrial bread above what traditional flour alone would give, and it is a declarable allergen so it must be flagged on the label. Its appearance in a meat alternative is a formulation tell, not a health flag.","adi":"Not applicable","uk":"Permitted; cereals containing gluten are a declarable allergen","refs":[]},{"code":"—","name":"Faba bean protein / fava bean protein","aka":["faba bean protein","fava bean protein","broad bean protein","faba protein"],"class":"Protein ingredient","job":"The newest structural protein in meat and dairy alternatives, used because it is soy-free, allergen-light and can be grown in northern Europe. Increasingly common in own-label ranges.","origin":"Broad beans, wet-fractionated into a protein isolate.","originType":"plant, industrially fractionated","vegan":"yes","tier":"context","why":"Nutritionally similar to pea protein and a genuinely lower-impact crop. One real safety caveat that no label mentions: people with G6PD deficiency (favism), an inherited condition most common in people of Mediterranean, Middle Eastern, African and South Asian descent, can have a severe haemolytic reaction to broad beans. Faba is not one of the 14 declarable UK allergens, so it will not be highlighted on the pack.","adi":"Not applicable","uk":"Permitted; not a declarable allergen","refs":[]},{"code":"—","name":"Coconut oil in dairy alternatives","aka":["coconut oil","coconut fat","refined coconut oil"],"class":"Fat","job":"The fat that makes vegan cheese melt and stretch and vegan butter solid at room temperature. Usually paired with starch and a stabiliser.","origin":"Coconut flesh, pressed and usually refined and deodorised.","originType":"plant","vegan":"yes","tier":"context","why":"Worth flagging because it is the nutritional weak point of most vegan cheese, and it runs against the assumption that plant-based means lower saturated fat. Coconut oil is about 82-90% saturated — higher than butter or lard — and controlled trials consistently show it raises LDL cholesterol compared with unsaturated oils. The 'medium-chain triglyceride' health framing does not transfer: coconut oil is mostly lauric acid, which behaves more like a long-chain saturated fat. A vegan cheese is typically starch, coconut oil and salt, with none of the protein or calcium of dairy cheese.","adi":"Not applicable","uk":"Permitted as an ingredient","refs":[]},{"code":"—","name":"Bamboo fibre / oat fibre / pea fibre / citrus fibre","aka":["bamboo fibre","oat fibre","pea fibre","citrus fibre","potato fibre","wheat fibre","cellulose fibre"],"class":"Bulking / fibre ingredient","job":"Cheap insoluble bulk that absorbs water, adds declarable fibre, and replaces flour, meat or fat. Common in reduced-fat, high-fibre and value-range products, and as a filler in sausages and burgers.","origin":"Milled plant material — bamboo stems, oat hulls, pea hulls, citrus peel.","originType":"plant fibre","vegan":"yes","tier":"context","why":"It is fibre and it is not harmful. But it is a different thing from the fibre in an actual vegetable: mostly insoluble, minimally fermentable, and contributing little of the fermentation products that make dietary fibre useful. Its presence usually means bulk has been added cheaply so that something else — meat, fat, flour — could be taken out. Read it as an economics signal.","adi":"Not applicable","uk":"Permitted as an ingredient","refs":[]},{"code":"—","name":"Concentrated fruit or vegetable juice as a colour","aka":["concentrated carrot juice","concentrated beetroot juice","fruit and vegetable concentrate","vegetable concentrate","concentrated blackcurrant juice","spirulina concentrate","safflower concentrate"],"class":"Colouring food (not a colour additive)","job":"Colours the product while sitting outside the additive rules entirely.","origin":"Fruit or vegetable juice, concentrated but not selectively purified for its pigment.","originType":"plant concentrate","vegan":"yes","tier":"context","why":"A real legal category, not a marketing dodge — but the line is finer than shoppers assume. If a concentrate is processed only to concentrate the juice, it is a 'colouring food' and is declared as an ingredient with no E-number. If it is selectively extracted to purify the pigment, it becomes a colour additive with an E-number and an ADI. Same plant, same purpose, different label, based on how far the processing went. M&S and premium own-label ranges lean heavily on this route. Nothing wrong with it — just know that 'no artificial colours' and 'no added colour' are different claims.","adi":"Not applicable — regulated as an ingredient","uk":"Governed by EU/GB guidance notes on colouring foods","refs":[]},{"code":"—","name":"Enzymes in bread (amylase, xylanase, lipase, glucose oxidase)","aka":["amylase","xylanase","lipase","glucose oxidase","asparaginase","transglutaminase","protease","enzyme","enzymes"],"class":"Processing aid","job":"The invisible engine of industrial baking. Enzymes replaced most chemical dough improvers: amylase keeps crumb soft, xylanase makes dough machinable, glucose oxidase strengthens gluten, asparaginase cuts acrylamide formation.","origin":"Produced by fermentation, often with genetically modified microorganisms.","originType":"microbial fermentation","vegan":"check","tier":"context","why":"The point is the labelling, not the toxicology. Enzymes used in baking are processing aids: they are inactivated by the oven, so under UK/EU rules they do NOT have to appear on the ingredient list at all. A loaf whose label reads 'flour, water, yeast, salt' may have had four or five enzymes in the dough. That is not dangerous — they are proteins and they are destroyed — but it means an ingredient list is not a complete account of what was used to make the food. On transglutaminase ('meat glue'), the widely repeated claim that the EU banned it is wrong: it is used as a food enzyme in the EU and GB. What was rejected in 2010 was thrombin, a different binding additive. Restructured meat does have to be labelled 'formed meat', so the honesty requirement is on the product name rather than the ingredient list.","adi":"Not applicable — processing aids, not declared","uk":"Processing aids; no labelling requirement","refs":[]},{"code":"—","name":"Acrylamide (a contaminant, not an ingredient)","aka":["acrylamide"],"class":"Process contaminant","job":"Not added — formed when starchy foods are baked, fried or roasted above about 120°C, from asparagine and sugars. Crisps, chips, roast potatoes, toast, biscuits, coffee.","origin":"Formed during cooking.","originType":"formed during cooking","vegan":"yes","tier":"exceeds","why":"Never on a label, so no ingredient app will ever flag it, and it has a stronger evidence base than almost anything that is. EFSA concluded in 2015 that acrylamide in food increases the lifetime risk of cancer for all age groups, with the margins of exposure indicating a concern — one of the few times a regulator has said that plainly about a food-borne substance. IARC classes it as probably carcinogenic to humans (Group 2A). GB law (retained Regulation 2017/2158) requires food businesses to apply mitigation measures and observe benchmark levels. At home the advice is simply to aim for golden rather than dark when roasting, frying or toasting. Note that the old 'never refrigerate raw potatoes' rule has been dropped — the FSA now says storing them in the fridge or a cool dark place is fine.","adi":"No safe level defined; EFSA uses margin-of-exposure and found a health concern","uk":"Regulated by mandatory mitigation measures and benchmark levels","refs":[{"t":"EFSA on acrylamide in food (2015)","u":"https://www.efsa.europa.eu/en/topics/topic/acrylamide"}]},{"code":"E442","name":"Ammonium phosphatides (YN)","aka":["ammonium phosphatides","e 442","yn"],"class":"Emulsifier","job":"Almost exclusively a chocolate emulsifier. It controls how molten chocolate flows, doing a similar job to lecithin, and is often used alongside or instead of it in own-label chocolate and coatings.","origin":"Made from partly hardened rapeseed oil reacted with glycerophosphoric acid and ammonia.","originType":"plant oil, chemically modified","vegan":"yes","tier":"settled","why":"Digested as fat and phosphate. EFSA re-evaluated it in 2018 and set an ADI of 30 mg/kg bw/day, with exposure below it. Its main practical significance is that it is a soy-free emulsifier — which is why it turns up in chocolate marketed as free from soya.","adi":"30 mg/kg bw/day","uk":"Permitted in GB and NI, restricted to cocoa and chocolate products","refs":[]},{"code":"E1400","name":"Dextrins and roasted starch (E1400, E1401, E1402)","aka":["dextrin","dextrins","roasted starch","white dextrin","yellow dextrin","e 1400","e 1401","e 1402","e 1403"],"class":"Thickener / bulking agent / carrier","job":"Starch broken into shorter chains by heat and acid. Used as a coating that crisps up in the oven or fryer, as a thickener, and as a carrier for flavours and seasonings.","origin":"Maize, wheat, potato or tapioca starch, roasted or acid-treated.","originType":"plant starch, thermally or chemically modified","vegan":"yes","tier":"context","why":"Digested as starch, no toxicological concern, no numerical ADI. Easy to confuse with maltodextrin — they are closely related and behave similarly in the body, both giving glucose quickly. Like maltodextrin, dextrin is a carbohydrate that does not register as 'sugars' on the nutrition panel. Its usual role on an own-label label is as the crisp coating on oven chips, breaded products and coated snacks.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E290","name":"Carbon dioxide","aka":["carbon dioxide","e 290","co2"],"class":"Packaging gas / propellant / acidity regulator","job":"The fizz in carbonated drinks. Also used as a packaging gas in modified-atmosphere packs — the reason a bag of salad or a pack of mince stays fresh for days.","origin":"Captured industrially, often as a by-product of fermentation or fertiliser manufacture, then purified to food grade.","originType":"gas","vegan":"yes","tier":"settled","why":"You breathe it out. No numerical ADI and no safety question. Included because it appears on ingredient lists and looks like a chemical additive when it is the least interesting thing in the pack. The only thing worth knowing is that carbonated drinks are mildly acidic, which is a dental erosion point rather than a toxicology one.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E938","name":"Packaging gases: nitrogen, argon, oxygen (E938-E949)","aka":["nitrogen","argon","oxygen","packaging gas","packaging gases","e 938","e 939","e 941","e 942","e 948","e 949","modified atmosphere"],"class":"Packaging gas / propellant","job":"Displaces air inside a pack so fats do not oxidise and bacteria grow more slowly. Nitrogen is why a crisp packet is inflated; a controlled oxygen mix is why supermarket mince stays red.","origin":"Separated from air.","originType":"gas","vegan":"yes","tier":"context","why":"Inert and harmless. One thing genuinely worth knowing: high-oxygen modified atmosphere packing keeps red meat looking bright red for far longer than it would otherwise, so colour is a much weaker freshness cue on supermarket meat than people assume. There is also evidence it accelerates fat oxidation and can toughen the meat. Not a health flag — a 'do not trust the colour' flag.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E965b","name":"Maltitol syrup and hydrogenated glucose syrup","aka":["maltitol syrup","hydrogenated glucose syrup","hydrogenated starch hydrolysate","e 965ii"],"class":"Sweetener (polyol)","job":"Liquid bulk sweetener in sugar-free confectionery, chocolate and chewy sweets, where a syrup rather than a crystal is needed.","origin":"Glucose syrup, hydrogenated.","originType":"plant starch, chemically modified","vegan":"yes","tier":"context","why":"Same story as the other polyols: partly absorbed, roughly 60-90% as sweet as sugar with fewer calories, and frankly laxative in quantity. Products above 10% polyol must carry 'excessive consumption may produce laxative effects'. Maltitol has the highest glycaemic response of the polyols, so sugar-free chocolate sweetened with it is not the blood-glucose-neutral product people assume.","adi":"No numerical ADI; laxative-effect labelling required above 10%","uk":"Permitted in GB and NI","refs":[]},{"code":"E262","name":"Sodium acetates (including sodium diacetate)","aka":["sodium diacetate","sodium acetates"],"class":"Acidity regulator / preservative","job":"The vinegar flavour and mild preservation in salt-and-vinegar crisps, packaged sliced meats, breads and sauces — vinegar taste without vinegar's water.","origin":"Made from acetic acid and sodium carbonate.","originType":"synthetic","vegan":"yes","tier":"context","why":"Toxicologically it is vinegar salt and there is no concern. Worth one note that gets missed: it contributes sodium. A crisp packet's salt figure includes it, but 'sodium diacetate' does not read as salt to most people scanning a label.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]}];
