<title>What's in this? — ingredient decoder</title>
<style>
:root{
  --bg:#12100e; --bg2:#1b1815; --bg3:#252118; --line:#3a3329;
  --ink:#f2ece2; --ink2:#b8ae9f; --ink3:#8a8072;
  --red:#e0654a; --amber:#e0a23c; --yellow:#d9c05a; --grey:#7f9a8a; --violet:#a98fd0;
  --redbg:rgba(224,101,74,.12); --amberbg:rgba(224,162,60,.12);
  --yellowbg:rgba(217,192,90,.10); --greybg:rgba(127,154,138,.10); --violetbg:rgba(169,143,208,.12);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-wrap:break-word;
  overscroll-behavior-y:none;
  touch-action:manipulation;              /* kills the 300ms tap delay and double-tap zoom */
}
h1,h2,h3{line-height:1.25;margin:0}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
a{color:#9dc4e8}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}
header.top{
  position:sticky;top:0;z-index:20;background:rgba(18,16,14,.92);
  backdrop-filter:saturate(140%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.top .bar{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;letter-spacing:-.02em;font-size:17px;flex:1}
.logo small{display:block;font-weight:400;font-size:11px;color:var(--ink3);letter-spacing:0}
.ghost{border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;color:var(--ink2);min-height:38px}
.ghost:active{background:var(--bg3)}

.hero{padding:22px 0 6px}
.hero h1{font-size:26px;letter-spacing:-.02em}
.hero p{color:var(--ink2);font-size:14px;margin:10px 0 0}

.actions{display:grid;gap:10px;margin:18px 0 8px}
.act{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
}
.act:active{background:var(--bg3)}
.act .ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--bg3);display:grid;place-items:center;font-size:19px}
.act b{display:block;font-size:15px}
.act span{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.act.primary{background:#2a2318;border-color:#4a3f2c}

/* 16px minimum on every input — anything smaller makes iOS Safari zoom on focus */
textarea{
  width:100%;min-height:160px;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r);padding:13px;color:var(--ink);font-size:16px;line-height:1.5;
  font-family:inherit;resize:vertical
}
input[type=text],input[type=tel]{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;
  padding:13px;color:var(--ink);font-size:16px;font-family:inherit;min-height:48px
}
.btn{background:var(--ink);color:#12100e;border-radius:12px;padding:15px 18px;font-weight:650;width:100%;text-align:center;min-height:50px}
.btn:active{opacity:.85}
.btn.sec{background:var(--bg3);color:var(--ink);border:1px solid var(--line)}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:12px 0}
.muted{color:var(--ink3);font-size:12.5px}
.sub{color:var(--ink2);font-size:13.5px}

.prod{display:flex;gap:13px;align-items:flex-start}
.prod img{width:62px;height:62px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.prod h2{font-size:18px;letter-spacing:-.01em}
.prod .brand{color:var(--ink3);font-size:13px;margin-top:3px}

.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}
.tal{border-radius:12px;padding:9px 8px;text-align:center;border:1px solid transparent}
.tal b{display:block;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.tal span{display:block;font-size:10px;margin-top:3px;letter-spacing:.02em;text-transform:uppercase}
.t-red{background:var(--redbg);border-color:rgba(224,101,74,.3);color:var(--red)}
.t-amber{background:var(--amberbg);border-color:rgba(224,162,60,.3);color:var(--amber)}
.t-yellow{background:var(--yellowbg);border-color:rgba(217,192,90,.25);color:var(--yellow)}
.t-grey{background:var(--greybg);border-color:rgba(127,154,138,.25);color:var(--grey)}

h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin:24px 0 8px;font-weight:600}

.item{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin:9px 0;overflow:hidden}
.item>.hd{display:flex;gap:11px;align-items:flex-start;padding:15px 14px;width:100%;text-align:left;min-height:52px}
.item .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.item .nm{flex:1;min-width:0}
.item .nm b{font-size:15px;font-weight:600;display:block}
.item .nm em{font-style:normal;color:var(--ink3);font-size:12px;display:block;margin-top:2px}
.item .chev{color:var(--ink3);font-size:13px;flex:none;margin-top:3px;transition:transform .18s}
.item.open .chev{transform:rotate(90deg)}
.item .bd{display:none;padding:0 14px 15px;border-top:1px solid var(--line);margin-top:2px;padding-top:13px}
.item.open .bd{display:block}
.item .bd h4{margin:13px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.item .bd h4:first-child{margin-top:0}
.item .bd p{margin:0;font-size:14.2px;color:var(--ink2)}
.item .bd p.hi{color:var(--ink)}
.d-red{background:var(--red)} .d-amber{background:var(--amber)} .d-yellow{background:var(--yellow)}
.d-grey{background:var(--grey)} .d-violet{background:var(--violet)}

.pill{display:inline-block;font-size:10.5px;padding:3px 8px;border-radius:999px;margin:5px 5px 0 0;border:1px solid var(--line);color:var(--ink3);vertical-align:middle}
.pill.red{color:var(--red);border-color:rgba(224,101,74,.4);background:var(--redbg)}
.pill.amber{color:var(--amber);border-color:rgba(224,162,60,.4);background:var(--amberbg)}
.pill.yellow{color:var(--yellow);border-color:rgba(217,192,90,.35);background:var(--yellowbg)}
.pill.grey{color:var(--grey);border-color:rgba(127,154,138,.35);background:var(--greybg)}
.pill.violet{color:var(--violet);border-color:rgba(169,143,208,.4);background:var(--violetbg)}

.refs a{display:block;font-size:12.5px;margin-top:5px;color:#9dc4e8;text-decoration:none}
.refs a:active{text-decoration:underline}

#scan{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column}
#scan video{flex:1;width:100%;object-fit:cover;background:#000}
#scan .ov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#scan .box{width:78%;max-width:340px;height:150px;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 4000px rgba(0,0,0,.45)}
#scan .ft{padding:14px 16px calc(18px + env(safe-area-inset-bottom));background:#000;display:flex;gap:8px;align-items:center}
#scan .ft .st{flex:1;font-size:13px;color:#bbb;min-width:0}
#scan .ft .ghost{color:#eee;border-color:#444}
#scan .ft .ghost.on{background:#eee;color:#000}
#scan video{padding-top:env(safe-area-inset-top)}

.tabs{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tab{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink2);white-space:nowrap}
.tab.on{background:var(--ink);color:#12100e;border-color:var(--ink);font-weight:600}

.hidden{display:none!important}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--ink3);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:12.5px;color:var(--ink3);line-height:1.55}
.legend{display:flex;gap:8px;align-items:flex-start;margin:9px 0}
.legend .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.legend div{flex:1;font-size:13px;color:var(--ink2)}
.legend b{color:var(--ink);display:block;font-size:13.5px}
.recent{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.recent button{border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--ink2);background:var(--bg2)}
.bar-nut{height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;margin-top:6px}
.bar-nut i{display:block;height:100%;border-radius:3px}
</style>

<script>
/* ============================================================
   DATA (injected at build time)
   ============================================================ */
const DB = [{"code":"E407","name":"Carrageenan","aka":["carrageenan","carrageenans","irish moss extract","e 407"],"class":"Thickener / gelling agent / stabiliser","job":"Binds water and stops things separating. In plant milks it keeps the drink looking creamy and stops it splitting in coffee; in vegan cheese and yoghurt it does the job dairy casein would do. It is also used in ham, poultry and fish brines to hold added water in the meat.","origin":"Extracted from red seaweeds (Chondrus crispus, Eucheuma species). Plant/algal, not synthetic.","originType":"seaweed extract","vegan":"yes","tier":"unsettled","why":"This is the clearest example of an additive where the science genuinely is not finished. EFSA re-evaluated it in 2018 and could only give it a TEMPORARY group ADI of 75 mg/kg body weight per day, explicitly because of gaps in the chemistry, exposure and toxicology data — it could produce refined exposure estimates for only 41 of 79 food categories. Animal studies on gut inflammation are contested, and the French NutriNet-Sante cohort (2024) reported a breast cancer hazard ratio of 1.28 (95% CI 1.06-1.56) for higher carrageenan intake, with no colorectal signal. That cohort is observational, mostly female, health-conscious volunteers, and emulsifier intake tracks ultra-processed food intake generally, so it cannot show cause. Important distinction: 'degraded carrageenan' (poligeenan), the substance most scare articles cite, is a different, lower-molecular-weight material that is NOT authorised in food.","adi":"Temporary group ADI 75 mg/kg bw/day (EFSA 2018) — 'temporary' means data were incomplete","uk":"Permitted in GB and NI. Not permitted in ordinary infant or follow-on formula, though it is authorised in specialised medical formulae for infants — EFSA has an open call for data on that use.","refs":[{"t":"EFSA re-evaluation of carrageenan (2018)","u":"https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2018.5238"},{"t":"Sellem et al., emulsifiers and cancer, PLOS Medicine 2024","u":"https://journals.plos.org/plosmedicine/article?id=10.1371%2Fjournal.pmed.1004338"}]},{"code":"E466","name":"Carboxymethyl cellulose (cellulose gum, CMC)","aka":["carboxymethyl cellulose","carboxymethylcellulose","cellulose gum","sodium carboxymethyl cellulose","cmc","e 466"],"class":"Emulsifier / thickener","job":"Thickens and stops separation — ice cream (blocks ice crystals), sauces, low-fat spreads, gluten-free bakery, plant milks, and as a bulking agent in reduced-sugar products.","origin":"Cellulose from wood pulp or cotton linters, chemically modified with chloroacetic acid. Plant-sourced but heavily processed; it does not occur in nature.","originType":"chemically modified plant fibre","vegan":"yes","tier":"unsettled","why":"CMC has the strongest MECHANISTIC case of any emulsifier, and still no proof of harm in humans. Mouse work (Chassaing/Gewirtz) showed CMC thins the protective gut mucus layer and lets bacteria encroach on the gut wall, driving low-grade inflammation. The FRESH randomised controlled feeding trial (Gastroenterology 2022) fed healthy adults CMC for 11 days and found real changes — altered microbiota, reduced short-chain fatty acids, bacterial encroachment into mucus in a subset — but NO overt inflammation or disease. Separately the NutriNet-Sante cohort linked CMC to a small increase in cardiovascular risk (HR 1.03, 1.01-1.05 per 10% intake increase). So: biologically plausible, measurable short-term effects, no demonstrated long-term harm.","adi":"EFSA has not set a numerical ADI for celluloses ('not specified' — the usual signal for low concern), but the mechanistic questions post-date that view","uk":"Permitted in GB and NI","refs":[{"t":"FRESH trial, Gastroenterology 2022","u":"https://www.gastrojournal.org/article/S0016-5085(21)03728-8/fulltext"},{"t":"Sellem et al., emulsifiers and CVD, BMJ 2023","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10480690/"}]},{"code":"E433","name":"Polysorbate 80","aka":["polysorbate 80","polyoxyethylene sorbitan monooleate","tween 80","e 433"],"class":"Emulsifier","job":"A detergent-like emulsifier that keeps oil and water mixed. Common in ice cream, some sauces and in pharmaceutical/vitamin preparations.","origin":"Synthetic — sorbitol reacted with ethylene oxide and oleic acid. Oleic acid is usually plant-derived but can be animal-derived.","originType":"synthetic","vegan":"check","tier":"unsettled","why":"Along with CMC, polysorbate 80 is the emulsifier in the mouse studies that started the whole gut-microbiome-and-emulsifiers question: at doses roughly translatable to human intake it degraded the mucus barrier and promoted metabolic syndrome and colitis in susceptible mice. No human trial has shown the same. It is used at low levels and total dietary exposure is small.","adi":"25 mg/kg bw/day (group ADI for polysorbates, EFSA)","uk":"Permitted in GB and NI","refs":[{"t":"Chassaing et al., emulsifiers and gut microbiota, Nature 2015","u":"https://www.nature.com/articles/nature14232"}]},{"code":"E471","name":"Mono- and diglycerides of fatty acids","aka":["mono- and diglycerides of fatty acids","mono and diglycerides of fatty acids","monoglycerides","diglycerides","mono-and di-glycerides","e 471","glycerol monostearate"],"class":"Emulsifier","job":"The workhorse emulsifier of the supermarket. Keeps bread soft for days, stops margarine and spreads splitting, gives ice cream its texture, keeps plant milks stable.","origin":"Made by splitting and recombining fats and glycerol. The fat can be palm, rapeseed, soy — or animal tallow. UK and EU labelling does NOT require the source to be declared, so you cannot tell from the label.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"unsettled","why":"Chemically these are just the building blocks of ordinary dietary fat, and they are digested as fat, which is why regulators have never been worried. But E471 came out with the largest signal in the NutriNet-Sante cancer analysis (2024): all-cancer HR 1.15 (1.04-1.27), breast 1.24 (1.03-1.51), prostate 1.46 (1.09-1.97), and a small CVD signal in the companion BMJ paper. That is a single observational cohort, uncorrected for the fact that people eating a lot of E471 are eating a lot of cake, biscuits and ice cream. Treat it as a marker of an ultra-processed diet at least as much as a suspect in its own right.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI. If you are vegan or vegetarian, the origin question is real — ask the manufacturer.","refs":[{"t":"Sellem et al., emulsifiers and cancer, PLOS Medicine 2024","u":"https://journals.plos.org/plosmedicine/article?id=10.1371%2Fjournal.pmed.1004338"}]},{"code":"E472b","name":"Lactic acid esters of mono- and diglycerides (LACTEM)","aka":["lactic acid esters of mono- and diglycerides of fatty acids","lactem","e 472b"],"class":"Emulsifier","job":"Whipping and aeration — dessert toppings, whipped and 'squirty' creams, cake mixes, non-dairy creamers.","origin":"Mono/diglycerides (plant or animal fat) reacted with lactic acid. Lactic acid in food use is normally from bacterial fermentation, not milk.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"unsettled","why":"Had the largest single signal in the NutriNet-Sante cardiovascular analysis: HR 1.06 (1.02-1.10) for total CVD and 1.11 (1.06-1.16) for cerebrovascular disease per 10% increase in intake. Same caveats as all that work — observational, self-reported intake, heavy overlap with ultra-processed food intake.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[{"t":"Sellem et al., emulsifiers and CVD, BMJ 2023","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10480690/"}]},{"code":"E472c","name":"Citric acid esters of mono- and diglycerides (CITREM)","aka":["citric acid esters of mono- and diglycerides of fatty acids","citrem","e 472c"],"class":"Emulsifier","job":"Stops fat separating in meat products, margarine and cooking oils; anti-spattering agent in frying fats.","origin":"Mono/diglycerides reacted with citric acid (citric acid itself is made by fermenting sugar with Aspergillus mould).","originType":"variable — plant oil or animal fat","vegan":"check","tier":"unsettled","why":"Small CVD signal in NutriNet-Sante (HR 1.04, 1.02-1.07). Otherwise unremarkable and no regulatory concern.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[{"t":"Sellem et al., emulsifiers and CVD, BMJ 2023","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10480690/"}]},{"code":"E472e","name":"Mono- and diacetyltartaric acid esters (DATEM)","aka":["mono- and diacetyltartaric acid esters of mono- and diglycerides of fatty acids","datem","e 472e","diacetyl tartaric acid ester"],"class":"Emulsifier / flour treatment","job":"Bread improver. Strengthens the gluten network so industrial dough rises higher and more reliably, and the loaf stays soft.","origin":"Mono/diglycerides reacted with tartaric acid (a by-product of winemaking).","originType":"variable — plant oil or animal fat","vegan":"check","tier":"context","why":"No specific health signal in humans. Its main significance is as a marker: DATEM in a bread ingredient list tells you it is an industrial loaf built for speed and shelf life rather than a slow-fermented one.","adi":"50 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E461","name":"Methyl cellulose","aka":["methyl cellulose","methylcellulose","e 461"],"class":"Thickener / binder","job":"The single most important additive in plant-based burgers. It is a thermoreversible gel: it is soft when cold and SETS when heated, which is the opposite of most gels. That is what stops a vegan burger falling apart in the pan — it is doing the structural job that myosin and fat do in mince.","origin":"Cellulose from wood pulp, chemically methylated. Plant-sourced, heavily processed.","originType":"chemically modified plant fibre","vegan":"yes","tier":"context","why":"Not digested or absorbed — it passes through. It is used medically as a bulk-forming laxative, which is the origin of most of the alarm about it: at food-additive doses (a fraction of a gram) that effect is irrelevant; at laxative doses (several grams) it is the point. No regulatory concern and no cohort signal. It IS, however, a reliable marker that you are holding a highly formulated product.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[{"t":"EFSA re-evaluation of celluloses (2018)","u":"https://www.efsa.europa.eu/en/efsajournal/pub/5047"}]},{"code":"E464","name":"Hydroxypropyl methyl cellulose (HPMC)","aka":["hydroxypropyl methyl cellulose","hydroxypropyl methylcellulose","hpmc","hypromellose","e 464"],"class":"Thickener / binder / glazing agent","job":"Same structural job as methyl cellulose in meat alternatives; also the standard film-former in gluten-free bread and in vegetarian capsule shells.","origin":"Chemically modified wood-pulp cellulose.","originType":"chemically modified plant fibre","vegan":"yes","tier":"context","why":"Not absorbed; no established health concern. Worth knowing about mainly as a formulation marker, and because it is the vegan replacement for gelatine in capsules.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E460","name":"Cellulose (microcrystalline / powdered)","aka":["cellulose","microcrystalline cellulose","powdered cellulose","e 460","e460i","e460ii"],"class":"Bulking agent / anti-caking agent","job":"Adds bulk without calories and stops grated cheese and powders clumping. Also used as a fat mimic in reduced-fat products.","origin":"Purified plant fibre, usually wood pulp.","originType":"plant fibre","vegan":"yes","tier":"unsettled","why":"It is dietary fibre and is not absorbed, so the toxicological picture is benign. The only signal is the NutriNet-Sante CVD paper, where total celluloses gave HR 1.05 (1.02-1.09) and E460 specifically 1.05 (1.01-1.09) per 10% intake increase. Almost certainly a proxy for processed food intake rather than an effect of wood fibre, but the honest position is that it has not been ruled out.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[{"t":"Sellem et al., emulsifiers and CVD, BMJ 2023","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10480690/"}]},{"code":"E418","name":"Gellan gum","aka":["gellan gum","e 418"],"class":"Thickener / gelling agent / stabiliser","job":"Used at tiny levels (around 0.02%) in plant milks to hold added calcium and other minerals in suspension so they do not settle at the bottom of the carton.","origin":"Produced by fermenting sugar with the bacterium Sphingomonas elodea.","originType":"microbial fermentation","vegan":"yes","tier":"settled","why":"Not absorbed, no toxicological concern at the levels used, no cohort signal. EFSA re-evaluated it and raised no safety issue at reported use levels.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E415","name":"Xanthan gum","aka":["xanthan gum","xanthan","e 415"],"class":"Thickener / stabiliser","job":"Thickens without heat and stops separation — sauces, dressings, gluten-free baking, plant milks.","origin":"Fermented from sugar by the bacterium Xanthomonas campestris.","originType":"microbial fermentation","vegan":"yes","tier":"settled","why":"A soluble fibre that is fermented by gut bacteria rather than absorbed. EFSA found no safety concern at reported uses. Large amounts can cause bloating; at food-additive levels this is not an issue. Note: it is grown on a sugar substrate that is sometimes corn, wheat or soy derived — relevant only for severe allergy.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E412","name":"Guar gum","aka":["guar gum","e 412"],"class":"Thickener / stabiliser","job":"Thickening and preventing ice crystals — ice cream, sauces, gluten-free bread.","origin":"Ground endosperm of the guar bean (Cyamopsis tetragonoloba). A milled seed, not a synthesised chemical.","originType":"plant (seed)","vegan":"yes","tier":"settled","why":"Soluble fibre; not absorbed. No safety concern at food levels. (High-dose guar slimming tablets were banned decades ago after causing oesophageal blockages — nothing to do with its use as a thickener.)","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E410","name":"Locust bean gum (carob gum)","aka":["locust bean gum","carob gum","carob bean gum","e 410"],"class":"Thickener / stabiliser","job":"Texture and freeze-thaw stability, especially in ice cream and cream cheese; often paired with carrageenan or xanthan.","origin":"Ground seed endosperm of the carob tree.","originType":"plant (seed)","vegan":"yes","tier":"settled","why":"Non-absorbed plant fibre, no safety concern at use levels.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E407a","name":"Processed eucheuma seaweed (PES)","aka":["processed eucheuma seaweed","pes","e 407a"],"class":"Thickener / gelling agent","job":"A cheaper, less refined cousin of carrageenan used for the same water-binding jobs.","origin":"Alkali-treated whole red seaweed (Eucheuma).","originType":"seaweed extract","vegan":"yes","tier":"unsettled","why":"Shares the temporary group ADI and the unresolved data gaps of carrageenan, and was included in the carrageenan/breast cancer signal in NutriNet-Sante (2024). Because it is less refined it contains a higher proportion of low-molecular-weight material, which is the fraction the safety debate is about.","adi":"Temporary group ADI 75 mg/kg bw/day with carrageenan (EFSA 2018)","uk":"Permitted in GB and NI","refs":[{"t":"EFSA re-evaluation of carrageenan and PES (2018)","u":"https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2018.5238"}]},{"code":"E440","name":"Pectin","aka":["pectin","pectins","amidated pectin","e 440"],"class":"Gelling agent","job":"Sets jam and fruit preparations, thickens yoghurts and fruit fillings.","origin":"Extracted from citrus peel and apple pomace — by-products of juice making.","originType":"plant (fruit)","vegan":"yes","tier":"settled","why":"Soluble dietary fibre that people also take deliberately as a supplement. No safety concern; EFSA set no numerical ADI.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E406","name":"Agar","aka":["agar","agar-agar","e 406"],"class":"Gelling agent","job":"Sets desserts and vegan jellies; the standard plant replacement for gelatine.","origin":"Red seaweed extract.","originType":"seaweed extract","vegan":"yes","tier":"settled","why":"Non-absorbed polysaccharide; no safety concern at use levels.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E414","name":"Gum arabic (acacia gum)","aka":["gum arabic","acacia gum","gum acacia","e 414"],"class":"Stabiliser / glazing agent","job":"Keeps flavour oils dispersed in soft drinks; glazes confectionery.","origin":"Dried sap of Acacia trees.","originType":"plant (tree exudate)","vegan":"yes","tier":"settled","why":"One of the oldest food additives; a soluble fibre, no safety concern.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E401","name":"Sodium alginate","aka":["sodium alginate","alginate","alginic acid","e 401","e 400"],"class":"Thickener / gelling agent","job":"Gels and thickens; used in restructured foods, sauces and vegan 'caviar' spheres.","origin":"Brown seaweed extract.","originType":"seaweed extract","vegan":"yes","tier":"settled","why":"Non-absorbed; EFSA raised no concern at reported use levels.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E322","name":"Lecithins","aka":["lecithin","lecithins","soya lecithin","soy lecithin","sunflower lecithin","e 322"],"class":"Emulsifier","job":"The everyday emulsifier — chocolate (cuts the cocoa butter needed and controls flow), margarine, bread, instant powders.","origin":"Usually from soya or sunflower oil refining; occasionally from egg yolk (which would then be declared as an allergen).","originType":"plant (usually) — occasionally egg","vegan":"check","tier":"settled","why":"A normal component of cell membranes and of foods like egg and soy; digested as fat. EFSA found no safety concern. Soya lecithin must be declared as an allergen, though the refined product contains very little soy protein.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E476","name":"Polyglycerol polyricinoleate (PGPR)","aka":["polyglycerol polyricinoleate","pgpr","e 476"],"class":"Emulsifier","job":"Almost exclusively a chocolate additive. It lowers the yield stress of molten chocolate so it flows into moulds with less cocoa butter — a cost-reduction ingredient.","origin":"Glycerol polymerised and esterified with castor oil fatty acids.","originType":"plant oil, chemically modified","vegan":"yes","tier":"context","why":"No health concern at the levels used (EFSA re-evaluated it in 2017 and confirmed the ADI with a wide margin). Its real meaning is economic: PGPR usually means less cocoa butter and a cheaper chocolate.","adi":"25 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E481","name":"Sodium stearoyl-2-lactylate (SSL)","aka":["sodium stearoyl-2-lactylate","sodium stearoyl lactylate","ssl","e 481","e 482","calcium stearoyl-2-lactylate"],"class":"Emulsifier / flour treatment","job":"Dough strengthener and crumb softener in industrial bread and buns.","origin":"Stearic acid (plant or animal fat) combined with lactic acid.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"context","why":"No specific health signal. Like DATEM, it is a marker of fast industrial baking. Origin of the stearic acid is not declared on the label.","adi":"20 mg/kg bw/day (group ADI with E482)","uk":"Permitted in GB and NI","refs":[]},{"code":"E249","name":"Potassium nitrite / sodium nitrite (E249, E250)","aka":["potassium nitrite","sodium nitrite","e 249","e 250","nitrite","curing salt"],"class":"Preservative / colour fixative","job":"Two jobs in cured meat: it blocks Clostridium botulinum (the reason it exists), and it reacts with myoglobin to give bacon and ham their pink colour and cured flavour. Without it, ham is grey.","origin":"Synthetic inorganic salt. Also occurs naturally — celery juice powder is concentrated nitrate that bacteria convert to nitrite, which is how 'nitrite-free' cured meats are actually cured.","originType":"synthetic (or 'natural' via celery/vegetable powder — chemically the same)","vegan":"yes","tier":"exceeds","why":"This is one of the few additives where the concern is well evidenced rather than speculative. In the stomach, nitrite can form N-nitroso compounds; EFSA's 2023 assessment concluded the margins of exposure for N-nitrosamines from food indicate a health concern for all age groups. IARC classifies processed meat itself as Group 1 (carcinogenic to humans) for bowel cancer — about 18% higher risk per 50 g eaten per day. France's ANSES confirmed the exposure-cancer association in 2022 and recommended reducing use and limiting deli meat to 150 g a week. The EU cut permitted levels in Regulation 2023/2108, applying from October 2025. NOTE: GB has not adopted that reduction; Northern Ireland has. Nitrite ADI is 0.07 mg/kg bw/day and EFSA found total dietary exposure can exceed it.","adi":"0.07 mg/kg bw/day (nitrite ion); nitrate 3.7 mg/kg bw/day","uk":"Permitted in GB and NI. The EU's 2023 reduction in maximum levels applies in NI but has NOT been adopted in GB.","refs":[{"t":"EFSA N-nitrosamines in food (2023)","u":"https://www.efsa.europa.eu/en/efsajournal/pub/7884"},{"t":"ANSES on nitrites and nitrates (2022)","u":"https://www.anses.fr/en/content/reducing-dietary-exposure-nitrites-and-nitrates"},{"t":"WHO/IARC on processed meat","u":"https://www.who.int/news-room/questions-and-answers/item/cancer-carcinogenicity-of-the-consumption-of-red-meat-and-processed-meat"}]},{"code":"E251","name":"Sodium nitrate / potassium nitrate (E251, E252)","aka":["sodium nitrate","potassium nitrate","saltpetre","e 251","e 252","nitrate"],"class":"Preservative","job":"A slow-release reservoir in long-cured meats and some cheeses: bacteria convert nitrate to nitrite over weeks of curing.","origin":"Synthetic inorganic salt (also abundant naturally in leafy vegetables).","originType":"synthetic","vegan":"yes","tier":"exceeds","why":"Same chain of concern as nitrite, since nitrate is a precursor to it. Context matters enormously though: most dietary nitrate comes from vegetables, where it is associated with LOWER blood pressure, not cancer — the difference is the food matrix (vitamin C and polyphenols in vegetables suppress nitrosamine formation; the amines in meat promote it). The flag here is about cured meat, not about spinach.","adi":"3.7 mg/kg bw/day (nitrate ion)","uk":"Permitted in GB and NI; EU 2023 level reductions apply in NI only.","refs":[{"t":"EFSA nitrates re-evaluation","u":"https://www.efsa.europa.eu/en/efsajournal/pub/4787"}]},{"code":"E220","name":"Sulphur dioxide and sulphites (E220-E228)","aka":["sulphur dioxide","sulfur dioxide","sulphites","sulfites","sodium metabisulphite","potassium metabisulphite","sodium sulphite","e 220","e 221","e 222","e 223","e 224","e 226","e 227","e 228"],"class":"Preservative / antioxidant","job":"Stops browning and microbial spoilage — dried fruit, wine, fruit juices, some sausages and burgers (where it also keeps mince looking red), pickles, dried potato products.","origin":"Synthetic inorganic sulphur compounds; sulphites also arise naturally in fermentation, so all wine contains some.","originType":"synthetic","vegan":"yes","tier":"exceeds","why":"The highest-confidence flag in this app for a specific group of people. Sulphites trigger genuine, documented reactions in asthmatics — wheezing, chest tightness — in a minority who are sensitive. Separately, EFSA WITHDREW the temporary ADI in 2022 because the toxicological database was inadequate to set one, and noted that estimated exposure exceeded the old temporary ADI (0.7 mg SO2/kg bw/day) across all age groups. That is a regulator saying 'we cannot currently establish this is safe at current intakes', which is a stronger statement than any cohort study.","adi":"No ADI — EFSA withdrew the temporary ADI in 2022 citing inadequate data","uk":"Permitted in GB and NI. Must be declared as an allergen when above 10 mg/kg or 10 mg/litre.","refs":[{"t":"EFSA re-evaluation of sulphur dioxide and sulphites (2022)","u":"https://www.efsa.europa.eu/sites/default/files/2022-11/EFS2_7594.pdf"}]},{"code":"E338","name":"Phosphoric acid and phosphates (E338-E341, E343, E450-E452)","aka":["phosphoric acid","sodium phosphate","trisodium phosphate","potassium phosphate","calcium phosphate","diphosphates","triphosphates","polyphosphates","sodium triphosphate","e 338","e 339","e 340","e 341","e 343","e 450","e 451","e 452"],"class":"Acidity regulator / raising agent / water-binder","job":"Several jobs: the sharp bite in cola; the water-holding agent that lets ham, bacon, chicken and processed fish carry added water and stay juicy; the melting salt in processed cheese; the raising agent in self-raising flour and cake mixes.","origin":"Mined phosphate rock, processed into food-grade salts.","originType":"mineral","vegan":"yes","tier":"exceeds","why":"The strongest 'this is actually being exceeded in real diets' case of any additive group. EFSA set a group ADI of 40 mg/kg body weight per day (as phosphorus) in 2019 and found that mean intake EXCEEDS it in infants, toddlers and children, and at the 95th percentile up to adolescents. Ham, bacon, reformed chicken, processed cheese, processed fish and cola are the main contributors. Observational data link high phosphate intake to cardiovascular and kidney outcomes, particularly in people with reduced kidney function — added phosphate salts are absorbed far more completely than the phosphorus naturally bound in food. Also worth knowing: polyphosphates in meat are how you end up paying meat prices for water.","adi":"Group ADI 40 mg/kg bw/day expressed as phosphorus (EFSA 2019) — exceeded in children","uk":"Permitted in GB and NI","refs":[{"t":"EFSA re-evaluation of phosphates (2019)","u":"https://efsa.onlinelibrary.wiley.com/doi/10.2903/j.efsa.2019.5674"}]},{"code":"E171","name":"Titanium dioxide","aka":["titanium dioxide","e 171"],"class":"Colour (white / opacifier)","job":"Makes things opaque and bright white — icing, chewing gum coatings, some sauces, and the white shell on sweets and supplements.","origin":"Mined mineral, purified. Contains a fraction of nanoscale particles.","originType":"mineral","vegan":"yes","tier":"unsettled","why":"The clearest regulatory split between GB and the EU, and a real scientific disagreement rather than a safety scandal. EFSA concluded in 2021 that it could no longer be considered safe as a food additive because genotoxicity (DNA damage) could not be ruled out; the EU banned it from food in 2022. The UK's COT reviewed the same evidence and DISAGREED, finding little evidence of a genotoxicity concern and deriving a health-based guidance value of 10 mg/kg bw/day. So it remains legal in Great Britain, is not permitted in Northern Ireland, and two competent expert committees read the same data in opposite directions. If you see it on a GB label, that is what you are looking at.","adi":"No ADI. EFSA (2021): safety could not be established. COT (2025 draft): health-based guidance value 10 mg/kg bw/day.","uk":"PERMITTED in Great Britain. NOT permitted in the EU (banned 2022) or Northern Ireland.","refs":[{"t":"EFSA: titanium dioxide no longer considered safe (2021)","u":"https://www.efsa.europa.eu/en/news/titanium-dioxide-e171-no-longer-considered-safe-when-used-food-additive"},{"t":"UK COT draft statement on E171","u":"https://cot.food.gov.uk/Fifth%20draft%20statement%20on%20the%20safety%20of%20Titanium%20Dioxide%20(E171)%20as%20a%20Food%20Additive-%20Executive%20Summary"}]},{"code":"E102","name":"Tartrazine","aka":["tartrazine","e 102","fd&c yellow 5"],"class":"Colour (yellow)","job":"Bright lemon-yellow in soft drinks, sweets, desserts and some sauces.","origin":"Synthetic azo dye, made from petrochemical feedstocks.","originType":"synthetic","vegan":"yes","tier":"context","why":"One of the six 'Southampton colours'. After the 2007 Southampton study on children's behaviour, UK and EU law requires any food containing it to carry the warning 'may have an adverse effect on activity and attention in children'. Most UK manufacturers reformulated it out rather than carry that label, so seeing it on a British shelf is now unusual. It is also a recognised trigger for reactions in a small number of people, particularly some with aspirin sensitivity.","adi":"7.5 mg/kg bw/day","uk":"Permitted in GB and NI, but the product must carry the children's attention warning.","refs":[{"t":"FSA on food colours and hyperactivity","u":"https://www.food.gov.uk/safety-hygiene/food-additives"}]},{"code":"E104","name":"Quinoline yellow","aka":["quinoline yellow","e 104"],"class":"Colour (yellow)","job":"Greenish-yellow colour in drinks, sweets and smoked fish.","origin":"Synthetic dye.","originType":"synthetic","vegan":"yes","tier":"context","why":"A Southampton colour — triggers the mandatory 'may have an adverse effect on activity and attention in children' warning. EFSA lowered its ADI on re-evaluation. Banned as a food colour in the US, permitted in the UK/EU with the warning label.","adi":"0.5 mg/kg bw/day","uk":"Permitted in GB and NI with the children's attention warning.","refs":[]},{"code":"E110","name":"Sunset yellow FCF","aka":["sunset yellow","sunset yellow fcf","e 110","orange yellow s","fd&c yellow 6"],"class":"Colour (orange)","job":"Orange colour in squash, sweets, desserts and packet sauces.","origin":"Synthetic azo dye.","originType":"synthetic","vegan":"yes","tier":"context","why":"Southampton colour — mandatory children's attention warning in the UK. EFSA cut the ADI to a temporary 1 mg/kg bw/day in 2009, then restored it to 4 mg/kg bw/day in 2014 once better data arrived. A good illustration that these numbers move in both directions.","adi":"4 mg/kg bw/day (EFSA 2014)","uk":"Permitted in GB and NI with the children's attention warning.","refs":[]},{"code":"E122","name":"Carmoisine (azorubine)","aka":["carmoisine","azorubine","e 122"],"class":"Colour (red)","job":"Red colour in jellies, sweets, desserts and drinks.","origin":"Synthetic azo dye.","originType":"synthetic","vegan":"yes","tier":"context","why":"Southampton colour — mandatory children's attention warning. Not permitted as a food colour in the US.","adi":"4 mg/kg bw/day","uk":"Permitted in GB and NI with the children's attention warning.","refs":[]},{"code":"E124","name":"Ponceau 4R","aka":["ponceau 4r","cochineal red a","e 124"],"class":"Colour (red)","job":"Strawberry-red colour in desserts, tinned fruit, sweets and drinks.","origin":"Synthetic azo dye. Despite the alternative name 'cochineal red A' it has nothing to do with insects.","originType":"synthetic","vegan":"yes","tier":"context","why":"Southampton colour — mandatory children's attention warning. EFSA lowered the ADI to 0.7 mg/kg bw/day on re-evaluation and noted exposure could exceed it in children.","adi":"0.7 mg/kg bw/day","uk":"Permitted in GB and NI with the children's attention warning.","refs":[]},{"code":"E129","name":"Allura red AC","aka":["allura red","allura red ac","e 129","fd&c red 40"],"class":"Colour (red)","job":"Red colour in drinks, sweets, sauces and desserts.","origin":"Synthetic azo dye.","originType":"synthetic","vegan":"yes","tier":"context","why":"Southampton colour — mandatory children's attention warning in the UK. This is the most-used red dye in US processed food (Red 40), where no such warning is required.","adi":"7 mg/kg bw/day","uk":"Permitted in GB and NI with the children's attention warning.","refs":[]},{"code":"E120","name":"Cochineal / carminic acid / carmines","aka":["cochineal","carmine","carmines","carminic acid","e 120","natural red 4"],"class":"Colour (red/pink)","job":"Deep pink-red in yoghurts, drinks, sweets, sausage casings and some 'natural colour' products.","origin":"ANIMAL. Made from the crushed dried bodies of the cochineal scale insect (Dactylopius coccus). Roughly 70,000 insects per kilo of dye.","originType":"insect","vegan":"no","tier":"context","why":"Not a toxicological concern — it is a stable natural dye with a long history. It is here because it is the classic hidden animal ingredient: it appears in products labelled with 'natural colours' and there is no requirement to flag its insect origin. It can also cause rare but genuine allergic reactions, including anaphylaxis.","adi":"5 mg/kg bw/day (as carminic acid)","uk":"Permitted in GB and NI","refs":[]},{"code":"E428","name":"Gelatine","aka":["gelatine","gelatin","beef gelatine","pork gelatine","e 441","e 428"],"class":"Gelling agent (now labelled as an ingredient, not an additive)","job":"Sets jelly, marshmallows, mousses, some yoghurts and low-fat spreads; used as a clarifying agent in some juices.","origin":"ANIMAL. Collagen extracted from pig skin, cattle hide and bones.","originType":"animal","vegan":"no","tier":"context","why":"No safety concern. Listed here because the old codes (E441 in some references, E428 in the international INS system) are obsolete in UK and EU law — gelatine is now declared by name as an ingredient rather than as an E-number, which is actually more transparent. Vegetarian and vegan alternatives are agar (E406), pectin (E440) and carrageenan (E407).","adi":"Not applicable — a food ingredient","uk":"Permitted; must be declared by name","refs":[]},{"code":"E542","name":"Bone phosphate (edible bone phosphate)","aka":["bone phosphate","edible bone phosphate","e 542"],"class":"Anti-caking agent","job":"Keeps powders free-flowing.","origin":"ANIMAL. Made from degreased, steam-treated cattle and pig bone.","originType":"animal","vegan":"no","tier":"context","why":"Flagged for origin, not toxicity. Rare on UK labels now but still authorised.","adi":"Part of the phosphates group ADI (40 mg/kg bw/day as phosphorus)","uk":"Permitted in GB and NI","refs":[]},{"code":"E901","name":"Beeswax","aka":["beeswax","white beeswax","yellow beeswax","e 901"],"class":"Glazing agent","job":"Shine and moisture barrier on sweets, chocolate and fresh fruit.","origin":"ANIMAL (insect). Secreted by honeybees.","originType":"insect","vegan":"no","tier":"context","why":"No safety concern. Flagged because it is animal-derived and appears on products that otherwise look plant-based. Vegetarians generally accept it; vegans generally do not.","adi":"No numerical ADI","uk":"Permitted in GB and NI","refs":[]},{"code":"E904","name":"Shellac","aka":["shellac","e 904"],"class":"Glazing agent","job":"The hard shine on chocolate beans, jelly sweets, coated coffee beans and waxed apples and citrus.","origin":"ANIMAL (insect). Resin secreted by the lac insect (Kerria lacca), harvested from tree branches — the process kills large numbers of insects.","originType":"insect","vegan":"no","tier":"context","why":"No toxicological concern. Purely an origin flag — and a common one on fruit that looks like it came straight off the tree.","adi":"No numerical ADI","uk":"Permitted in GB and NI","refs":[]},{"code":"E913","name":"Lanolin","aka":["lanolin","e 913","wool fat","wool grease"],"class":"Glazing agent","job":"Surface treatment agent; also the industrial source of vitamin D3.","origin":"ANIMAL. Grease from sheep's wool.","originType":"animal","vegan":"no","tier":"context","why":"Origin flag. Notably, most vitamin D3 (cholecalciferol) added to fortified foods and supplements is made from lanolin — so a 'plant-based' fortified product may still contain a sheep-derived nutrient unless it says lichen-derived D3 or D2.","adi":"No numerical ADI","uk":"Permitted in GB and NI","refs":[]},{"code":"E1105","name":"Lysozyme","aka":["lysozyme","e 1105"],"class":"Preservative","job":"Antimicrobial used in some cheeses and wines.","origin":"ANIMAL. Extracted from hen egg white.","originType":"animal (egg)","vegan":"no","tier":"context","why":"Origin flag, and an allergen — egg-derived, so it must be declared for allergy purposes.","adi":"No numerical ADI","uk":"Permitted in GB and NI","refs":[]},{"code":"E631","name":"Disodium inosinate","aka":["disodium inosinate","sodium inosinate","e 631","e 627","disodium guanylate","e 635","disodium 5'-ribonucleotides"],"class":"Flavour enhancer","job":"Works with MSG to multiply savoury (umami) intensity — the combination is far stronger than either alone. Standard in crisps, instant noodles, stock cubes and savoury snacks.","origin":"Historically extracted from meat and sardines; today usually made by bacterial fermentation of sugars. The label does not say which.","originType":"variable — fermentation (usual) or fish/meat","vegan":"check","tier":"context","why":"No safety concern at food levels; EFSA set a group ADI covering these with glutamates. Two reasons to know about it: the origin is genuinely ambiguous for vegans, and people who need a low-purine diet (gout) should note these are purine compounds.","adi":"Covered by the glutamate/ribonucleotide group ADI","uk":"Permitted in GB and NI","refs":[]},{"code":"E621","name":"Monosodium glutamate (MSG)","aka":["monosodium glutamate","msg","e 621","glutamic acid","e 620","e 622","e 623","e 624","e 625","sodium glutamate"],"class":"Flavour enhancer","job":"Adds savoury depth. Glutamate is the same molecule that makes parmesan, tomatoes, soy sauce and mushrooms taste savoury.","origin":"Made by bacterial fermentation of sugar (usually molasses or starch).","originType":"microbial fermentation","vegan":"yes","tier":"context","why":"The folklore ('Chinese restaurant syndrome') is not supported: double-blind trials have repeatedly failed to reproduce symptoms when people do not know they are eating it. But the regulatory picture is more interesting than the folklore. EFSA set a group ADI of 30 mg/kg bw/day in 2017, derived from a NOAEL of 3,200 mg/kg with a 100-fold safety factor, and found that high consumers, toddlers and children can exceed it. So the honest flag is about total exposure across a processed diet, not about a mystery reaction.","adi":"Group ADI 30 mg/kg bw/day (EFSA 2017) — exceeded by some high consumers and children","uk":"Permitted in GB and NI","refs":[{"t":"EFSA re-evaluation of glutamates (2017)","u":"https://www.efsa.europa.eu/en/efsajournal/pub/4910"}]},{"code":"E951","name":"Aspartame","aka":["aspartame","e 951"],"class":"Sweetener","job":"Intense sweetener, ~200x sugar, in diet drinks, sugar-free desserts, chewing gum and tabletop sweeteners.","origin":"Synthetic — a dipeptide of two amino acids (aspartic acid and phenylalanine) plus a methyl group. Digested into those components.","originType":"synthetic","vegan":"yes","tier":"unsettled","why":"In July 2023 IARC classified aspartame as Group 2B, 'possibly carcinogenic to humans', based on LIMITED human evidence for liver cancer. On the same day, JECFA reaffirmed the acceptable daily intake of 40 mg/kg body weight — a 70 kg adult would need roughly 9-14 cans of diet drink a day to reach it. Group 2B is a hazard category shared with aloe vera extract and pickled vegetables; it says 'we cannot rule this out', not 'this causes cancer'. The NutriNet-Sante cohort also reported a small association with cancer (HR 1.15). Anyone with phenylketonuria must avoid it, which is why the label says 'contains a source of phenylalanine'.","adi":"40 mg/kg bw/day (EFSA and JECFA)","uk":"Permitted in GB and NI","refs":[{"t":"WHO/IARC/JECFA aspartame assessments (2023)","u":"https://www.who.int/news/item/14-07-2023-aspartame-hazard-and-risk-assessment-results-released"}]},{"code":"E950","name":"Acesulfame K","aka":["acesulfame k","acesulfame potassium","ace-k","e 950"],"class":"Sweetener","job":"Intense sweetener, usually blended with aspartame or sucralose because the blend tastes less artificial than either alone.","origin":"Synthetic.","originType":"synthetic","vegan":"yes","tier":"unsettled","why":"Not metabolised — it passes through unchanged, which historically made it look inert. The NutriNet-Sante cohort reported an association with overall cancer risk (HR 1.13, 1.01-1.26). Observational, single cohort, and diet-drink consumption is strongly confounded by why people switch to diet drinks in the first place. EFSA has not revised its position.","adi":"9 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[{"t":"Debras et al., artificial sweeteners and cancer, PLOS Medicine 2022","u":"https://journals.plos.org/plosmedicine/article?id=10.1371%2Fjournal.pmed.1003950"}]},{"code":"E955","name":"Sucralose","aka":["sucralose","e 955","splenda"],"class":"Sweetener","job":"Intense sweetener, ~600x sugar, heat-stable so it is used in baked and cooked products as well as drinks.","origin":"Synthetic — sucrose with three chlorine atoms substituted in.","originType":"synthetic","vegan":"yes","tier":"unsettled","why":"Long regarded as inert. A 2023 laboratory study reported that a metabolite formed in the gut, sucralose-6-acetate, was genotoxic in cell tests and increased intestinal permeability. That is in vitro work, disputed by other researchers, and has not changed any regulator's position — but it is a live question rather than a closed one.","adi":"15 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[{"t":"Sucralose-6-acetate genotoxicity study (2023)","u":"https://www.tandfonline.com/doi/full/10.1080/10937404.2023.2213903"}]},{"code":"E968","name":"Erythritol","aka":["erythritol","e 968"],"class":"Sweetener (sugar alcohol)","job":"Bulk sweetener with almost no calories; common in 'keto', sugar-free and low-carb products, often blended with stevia.","origin":"Made by fermenting glucose with yeast. Also occurs naturally in fruit and is made in small amounts by the human body.","originType":"microbial fermentation","vegan":"yes","tier":"unsettled","why":"A 2023 Nature Medicine study found people in the highest quartile of BLOOD erythritol had substantially higher rates of heart attack and stroke (HR 1.80 US cohort, 2.21 EU cohort), with laboratory evidence that erythritol enhances platelet clotting. The major caveat is that most blood erythritol is made by the body itself and rises with metabolic dysfunction, so the association may run backwards. The human feeding arm was 8 people. The FDA reviewed it in 2024 and was sceptical. Unresolved, and a good example of a headline that outran its evidence — but not nothing.","adi":"No numerical ADI; laxative effect at high doses","uk":"Permitted in GB and NI","refs":[{"t":"Witkowski et al., erythritol and cardiovascular risk, Nature Medicine 2023","u":"https://www.nature.com/articles/s41591-023-02223-9"}]},{"code":"E960","name":"Steviol glycosides (stevia)","aka":["steviol glycosides","stevia","rebaudioside a","e 960","e 960a","e 960c"],"class":"Sweetener","job":"Plant-derived intense sweetener, ~300x sugar, usually blended to mask its liquorice aftertaste.","origin":"Extracted from the leaves of Stevia rebaudiana — though the extraction is a substantial chemical process, and newer forms (E960c) are made by enzyme conversion or fermentation.","originType":"plant extract (or fermentation)","vegan":"yes","tier":"settled","why":"EFSA has evaluated it repeatedly and set an ADI of 4 mg/kg bw/day (as steviol equivalents) with no safety concern. No cohort signal. 'Natural' framing is a bit generous given the processing, but the toxicology is unremarkable.","adi":"4 mg/kg bw/day (as steviol equivalents)","uk":"Permitted in GB and NI","refs":[]},{"code":"E320","name":"Butylated hydroxyanisole (BHA)","aka":["butylated hydroxyanisole","bha","e 320"],"class":"Antioxidant","job":"Stops fats going rancid — chewing gum, some dried meats, fats and oils, stock cubes.","origin":"Synthetic phenolic compound.","originType":"synthetic","vegan":"yes","tier":"unsettled","why":"IARC classifies BHA as Group 2B (possibly carcinogenic) based on forestomach tumours in rodents — an organ humans do not have, which is the standard counterargument. EFSA set an ADI of 1.0 mg/kg bw/day and real exposure is far below it. The honest position: a rodent finding of contested relevance, low exposure, but not a substance anyone would design in today.","adi":"1.0 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E321","name":"Butylated hydroxytoluene (BHT)","aka":["butylated hydroxytoluene","bht","e 321"],"class":"Antioxidant","job":"Prevents rancidity in fats, oils and chewing gum.","origin":"Synthetic.","originType":"synthetic","vegan":"yes","tier":"unsettled","why":"EFSA re-evaluated BHT and set a relatively low ADI of 0.25 mg/kg bw/day. Not classified as a carcinogen; animal data show effects on liver and thyroid at high doses. Exposure from food is low. Increasingly replaced by tocopherols (vitamin E) or rosemary extract.","adi":"0.25 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"E520","name":"Aluminium-containing additives (E520-E559)","aka":["aluminium sulphate","sodium aluminium phosphate","aluminium silicate","sodium aluminium silicate","e 520","e 521","e 541","e 554","e 555","e 556","e 559","bentonite"],"class":"Anti-caking agent / raising agent / firming agent","job":"Keeps powders flowing, firms pickled vegetables, acts as a raising agent in some bakery products.","origin":"Mineral aluminium compounds.","originType":"mineral","vegan":"yes","tier":"exceeds","why":"EFSA set a tolerable WEEKLY intake of 1 mg aluminium per kg body weight and found that children in several European countries exceed it from food alone. Aluminium accumulates in bone and brain tissue over time; the evidence linking dietary aluminium to neurological disease in healthy people is weak, but the exposure margin is genuinely thin, which is unusual.","adi":"Tolerable weekly intake 1 mg Al/kg bw/week — exceeded by children in several member states","uk":"Permitted in GB and NI with restrictions","refs":[]},{"code":"E216","name":"Propyl paraben (propyl 4-hydroxybenzoate)","aka":["propyl paraben","propyl 4-hydroxybenzoate","e 216","e 217"],"class":"Preservative","job":"Antimicrobial preservative.","origin":"Synthetic.","originType":"synthetic","vegan":"yes","tier":"exceeds","why":"NOT authorised in UK or EU food since 2006. EFSA could not establish an ADI because of effects on sperm production in young rats with no clear no-effect level. If this genuinely appears in something you bought in the UK, the product should not be on sale. (E214/E218/E219 - ethyl and methyl parabens - remain authorised with a group ADI of 10 mg/kg bw/day.)","adi":"None — no ADI could be established","uk":"NOT authorised in GB or NI","refs":[]},{"code":"E211","name":"Sodium benzoate","aka":["sodium benzoate","benzoic acid","e 210","e 211","e 212","e 213"],"class":"Preservative","job":"Blocks yeast and mould in acidic foods — soft drinks, pickles, sauces, fruit products.","origin":"Synthetic, though benzoic acid occurs naturally in cranberries, cinnamon and cloves.","originType":"synthetic","vegan":"yes","tier":"context","why":"Two things worth knowing. First, benzoate was one of the mixtures in the Southampton children's behaviour study (paired with the azo colours), though it does not itself trigger the warning label. Second, benzoate plus ascorbic acid (vitamin C) in the same drink can form small amounts of benzene, a known carcinogen, particularly with heat and light — this caused reformulations across the soft drinks industry in the 2000s and levels are now monitored. Seeing E211 and vitamin C together in a soft drink is worth a raised eyebrow, not alarm.","adi":"5 mg/kg bw/day (group ADI)","uk":"Permitted in GB and NI","refs":[]},{"code":"E202","name":"Potassium sorbate","aka":["potassium sorbate","sorbic acid","e 200","e 202"],"class":"Preservative","job":"Mould and yeast inhibitor in bread, cheese, wine, dried fruit and dips.","origin":"Synthetic (sorbic acid was first isolated from rowan berries).","originType":"synthetic","vegan":"yes","tier":"context","why":"EFSA re-evaluated sorbates in 2015 with a temporary ADI, then in 2019 set a group ADI of 11 mg sorbic acid per kg bw/day for E200 and E202 after new data. Metabolised like a fatty acid; toxicologically unremarkable at food levels. (E203, calcium sorbate, was removed from the authorised list in 2018 for lack of data — so it should not appear on a current label.)","adi":"Group ADI 11 mg/kg bw/day as sorbic acid (EFSA 2019)","uk":"Permitted in GB and NI","refs":[]},{"code":"E300","name":"Ascorbic acid (vitamin C)","aka":["ascorbic acid","vitamin c","sodium ascorbate","ascorbates","e 300","e 301","e 302","e 304","ascorbyl palmitate"],"class":"Antioxidant","job":"Stops browning and rancidity; also a flour improver in industrial bread, and used in cured meat because it suppresses nitrosamine formation.","origin":"Manufactured by fermentation from glucose. E304 (ascorbyl palmitate) combines it with a fatty acid that may be plant or animal derived.","originType":"fermentation","vegan":"yes (E304 may vary)","tier":"settled","why":"It is vitamin C. EFSA set no numerical ADI. In cured meat it is actively protective — it inhibits the formation of the nitrosamines that are the concern with nitrite.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E330","name":"Citric acid","aka":["citric acid","citrate","sodium citrate","potassium citrate","calcium citrate","e 330","e 331","e 332","e 333"],"class":"Acidity regulator / antioxidant","job":"Provides sourness, controls pH, protects colour and flavour; the emulsifying salt in processed cheese.","origin":"Industrially made by fermenting sugar with the mould Aspergillus niger — not squeezed from lemons.","originType":"microbial fermentation","vegan":"yes","tier":"settled","why":"The most common additive in the supermarket and one of the least interesting. EFSA gives citrates a group ADI 'not specified', the standard designation for substances of no concern. It is a normal intermediate in human metabolism (the citric acid cycle). Note: the NutriNet-Sante paper reported a weak signal for E331; it did not hold up as a robust independent finding and is best treated as statistical noise.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E306","name":"Tocopherols (vitamin E)","aka":["tocopherols","tocopherol","alpha-tocopherol","mixed tocopherols","vitamin e","e 306","e 307","e 308","e 309"],"class":"Antioxidant","job":"Natural antioxidant protecting oils and fats from going rancid; the usual modern replacement for BHA and BHT.","origin":"Extracted from vegetable oils (usually soy or sunflower).","originType":"plant","vegan":"yes","tier":"settled","why":"It is vitamin E. No safety concern at additive levels.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E160b","name":"Annatto (bixin, norbixin)","aka":["annatto","bixin","norbixin","e 160b"],"class":"Colour (yellow-orange)","job":"Orange colour in cheese (Red Leicester, Cheddar), butter, smoked fish and snacks; also used in plant-based cheese and meat alternatives.","origin":"Seeds of the achiote tree (Bixa orellana).","originType":"plant","vegan":"yes","tier":"settled","why":"EFSA re-evaluated it in 2016 and set ADIs for the different preparations with no safety concern at reported uses. Rare allergic reactions have been reported.","adi":"6 mg/kg bw/day (bixin); 0.3 mg/kg bw/day (norbixin)","uk":"Permitted in GB and NI","refs":[]},{"code":"E162","name":"Beetroot red (betanin)","aka":["beetroot red","betanin","e 162"],"class":"Colour (red)","job":"The red that makes a raw plant-based burger look like raw mince and fade to brown when cooked.","origin":"Concentrated beetroot juice.","originType":"plant","vegan":"yes","tier":"settled","why":"Concentrated vegetable juice. EFSA raised no safety concern. Can turn urine pink, which is harmless and startling.","adi":"No numerical ADI ('not specified')","uk":"Permitted in GB and NI","refs":[]},{"code":"E150d","name":"Sulphite ammonia caramel (E150a-E150d)","aka":["caramel colour","caramel colours","plain caramel","caustic sulphite caramel","ammonia caramel","sulphite ammonia caramel","e 150a","e 150b","e 150c","e 150d"],"class":"Colour (brown)","job":"The brown in cola, beer, gravy, soy sauce, bread and sauces.","origin":"Made by heating sugars, sometimes with ammonia and/or sulphite compounds.","originType":"processed sugar","vegan":"yes","tier":"unsettled","why":"The ammonia-processed classes (E150c and E150d) contain 4-methylimidazole (4-MEI), a by-product that caused tumours in mice and led California to require a warning label above certain levels. EFSA re-evaluated caramel colours in 2011 and set a group ADI of 300 mg/kg bw/day, with a lower individual ADI of 100 mg/kg bw/day for E150c because of immune-system findings. It concluded 4-MEI was not a concern at authorised levels, but did find that high consumers could exceed the ADIs for E150a, E150c and E150d at maximum reported use levels. Cola manufacturers reformulated to cut 4-MEI in the US. A real but small question mark.","adi":"Group ADI 300 mg/kg bw/day; E150c has its own lower ADI of 100 mg/kg bw/day","uk":"Permitted in GB and NI","refs":[]},{"code":"—","name":"Modified starch / modified maize starch","aka":["modified starch","modified maize starch","modified corn starch","modified potato starch","modified tapioca starch","acetylated starch","hydroxypropyl starch","distarch phosphate","e 1404","e 1412","e 1414","e 1420","e 1422","e 1442","e 1450"],"class":"Thickener / stabiliser (E1400 series)","job":"Ordinary starch treated so it survives what normal starch cannot — freezing, acid, long cooking, sitting on a shelf. It is why a ready-meal sauce does not go watery after freezing.","origin":"Maize, potato, tapioca or wheat starch, physically or chemically modified. 'Modified' here does NOT mean genetically modified — that is the single most common misreading of a UK ingredient label.","originType":"plant, chemically or physically modified","vegan":"yes","tier":"context","why":"Digested as starch; no toxicological concern and EFSA sets no numerical ADI for most of the group. Its real information value is as a processing marker: modified starch means the product was engineered for shelf stability. Note that in the UK/EU most of these are labelled just as 'modified starch' without an E-number, so the label is less informative than it looks.","adi":"No numerical ADI ('not specified') for most modified starches","uk":"Permitted in GB and NI","refs":[]},{"code":"—","name":"Maltodextrin","aka":["maltodextrin","malto dextrin"],"class":"Bulking agent / carrier / thickener","job":"A cheap, bland, highly digestible carbohydrate used as bulk, as a carrier for flavours and sweeteners, and to give body to low-fat products.","origin":"Starch (usually maize or wheat) broken down by enzymes into short glucose chains.","originType":"plant starch, enzymatically broken down","vegan":"yes","tier":"context","why":"Not toxic, but not innocent either — and it is not an additive, it is an ingredient, so it has no E-number and never gets flagged by additive-scoring apps. Its glycaemic index is typically HIGHER than table sugar (often 85-105), and because it is not sweet it does not count towards 'sugars' on the nutrition panel. A 'no added sugar' product thickened with maltodextrin can spike blood glucose harder than one with sugar in it. That is the flag.","adi":"Not applicable — a food ingredient","uk":"Permitted as an ingredient","refs":[]},{"code":"—","name":"Glucose-fructose syrup / high-fructose corn syrup","aka":["glucose-fructose syrup","glucose fructose syrup","fructose-glucose syrup","high fructose corn syrup","hfcs","isoglucose","corn syrup"],"class":"Sweetener (bulk)","job":"Liquid sugar. Cheaper than sucrose, easier to pump, holds moisture, browns well.","origin":"Maize or wheat starch, enzymatically converted to glucose and then partly to fructose.","originType":"plant starch, enzymatically converted","vegan":"yes","tier":"context","why":"Nutritionally close to table sugar (sucrose is 50% fructose; glucose-fructose syrup in Europe is typically 42-55%). The evidence that it is uniquely worse than sugar is weak. The reason to flag it is that its presence reliably marks a product formulated to a low cost point, and it drives up free sugars — which is the actual health issue.","adi":"Not applicable","uk":"Permitted as an ingredient","refs":[]},{"code":"—","name":"Soy protein isolate / concentrate","aka":["soy protein isolate","soya protein isolate","soy protein concentrate","soya protein concentrate","textured soy protein","textured vegetable protein","tvp","soya protein"],"class":"Protein ingredient","job":"The structural protein of most meat alternatives. Defatted soy flour is stripped of carbohydrate to leave 90%+ protein, then extruded under heat and pressure to make fibres that shred like meat.","origin":"Soybeans, defatted (usually with hexane) and washed. Extraction typically uses hexane, which is a processing aid and is removed — not declared on labels.","originType":"plant, industrially fractionated","vegan":"yes","tier":"context","why":"This is the classic 'ultra-processed' marker — a whole food fractionated into a purified component and rebuilt. The nutritional evidence is not alarming: soy protein modestly lowers LDL cholesterol, and the SWAP-MEAT trial found lower LDL, lower TMAO and lower body weight on plant-based meat versus red meat over 8 weeks. Isoflavone and 'phytoestrogen' worries are not supported by human data at dietary intakes. But the isolate has lost the fibre, minerals and matrix of the bean, and the finished products are typically salty.","adi":"Not applicable","uk":"Permitted; soya is a declarable allergen","refs":[{"t":"SWAP-MEAT randomised trial, AJCN 2020","u":"https://ajcn.nutrition.org/article/S0002-9165(22)00890-5/fulltext"}]},{"code":"—","name":"Pea protein isolate","aka":["pea protein isolate","pea protein","yellow pea protein"],"class":"Protein ingredient","job":"The soy-free structural protein in many newer meat alternatives and protein drinks.","origin":"Yellow split peas, wet-fractionated to separate protein from starch and fibre.","originType":"plant, industrially fractionated","vegan":"yes","tier":"context","why":"Same story as soy isolate: not harmful, but a fractionated ingredient rather than a food. Lower in methionine than soy, which is why products often blend proteins. Not a declarable allergen in the UK, which matters because pea allergy exists and is not covered by the 14-allergen rules.","adi":"Not applicable","uk":"Permitted; not one of the 14 declarable allergens","refs":[]},{"code":"—","name":"Hydrolysed vegetable protein / hydrolysed soy protein","aka":["hydrolysed vegetable protein","hydrolyzed vegetable protein","hvp","hydrolysed soy protein","hydrolysed wheat protein","hydrolysed protein"],"class":"Flavouring ingredient","job":"Protein broken down with acid or enzymes into free amino acids — including glutamate. It delivers a savoury MSG-like hit while letting the label say 'no added MSG'.","origin":"Soy, wheat or maize protein, acid- or enzyme-hydrolysed.","originType":"plant, hydrolysed","vegan":"yes","tier":"context","why":"Worth flagging precisely because it is a labelling workaround: it is an ingredient, not an additive, so it carries no E-number, yet it is doing MSG's job. Acid hydrolysis can also generate chloropropanols (3-MCPD), a contaminant that is regulated and monitored; modern enzymatic processes largely avoid it.","adi":"Not applicable","uk":"Permitted as an ingredient","refs":[]},{"code":"—","name":"Yeast extract","aka":["yeast extract","autolysed yeast extract","yeast extract powder"],"class":"Flavouring ingredient","job":"Broken-down yeast cells, naturally rich in glutamate and nucleotides. Same savoury function as MSG plus E627/E631, sold as a clean-label ingredient.","origin":"Brewer's or baker's yeast, autolysed.","originType":"microbial","vegan":"yes","tier":"context","why":"Harmless — it is Marmite, essentially. Flagged only because 'no MSG, no artificial flavourings' plus yeast extract is one of the most common clean-label sleights of hand in the supermarket. High in purines, so relevant for gout.","adi":"Not applicable","uk":"Permitted as an ingredient","refs":[]},{"code":"—","name":"Natural flavouring / flavourings","aka":["natural flavouring","natural flavourings","flavouring","flavourings","natural flavour","natural flavors","smoke flavouring","natural smoke flavouring"],"class":"Flavouring","job":"Anything from a single molecule to a proprietary blend of dozens. 'Natural' is a legal term meaning the flavouring substance was obtained from a plant, animal or microbiological source — it does not mean it came from the food it tastes of.","origin":"Variable and undisclosed. Regulated under Regulation 1334/2008, not the additives regulation, so no E-numbers and no itemisation on the label.","originType":"undisclosed — plant, animal or microbial","vegan":"check","tier":"context","why":"The biggest transparency gap on a UK label. A product can be 90% ingredients you can name and still contain an undisclosed flavour blend. Safety is assessed at the substance level by EFSA and the risk is low, but the honest statement is: you cannot know what is in this, and it can be animal-derived. If you are vegan, 'natural flavouring' is the entry on the label you genuinely cannot resolve without asking the manufacturer. Smoke flavourings are a separate case — EFSA raised genotoxicity concerns about several in 2023 and the EU is phasing some out.","adi":"Assessed substance-by-substance","uk":"Permitted; no requirement to itemise","refs":[{"t":"EFSA on smoke flavourings (2023)","u":"https://www.efsa.europa.eu/en/news/smoke-flavourings-efsa-assesses-safety-eight-authorised-products"}]},{"code":"—","name":"Soy leghemoglobin","aka":["soy leghemoglobin","soy leghaemoglobin","leghemoglobin","heme","haem"],"class":"Flavour and colour ingredient","job":"The heme protein that makes an Impossible-style burger taste bloody and go from red to brown as it cooks.","origin":"Made by fermenting genetically engineered Pichia pastoris yeast carrying the soy plant gene.","originType":"GM microbial fermentation","vegan":"yes","tier":"context","why":"Novel food. EFSA's GMO panel gave a positive opinion in late 2024. In the UK it went through the FSA regulated products process (application RP-735) — check the FSA register for current status before assuming a product containing it is legally on sale in Great Britain. Not a safety flag, a novelty-and-authorisation flag.","adi":"Not applicable","uk":"Novel food — check the FSA regulated products register for current GB authorisation","refs":[{"t":"FSA regulated products register","u":"https://data.food.gov.uk/regulated-product-applications/products-list/RP-735"}]},{"code":"—","name":"Mycoprotein","aka":["mycoprotein","fusarium venenatum"],"class":"Protein ingredient","job":"The base of Quorn. Fungal biomass grown in a fermenter, harvested and textured — usually bound with egg white or, in vegan versions, potato protein.","origin":"The filamentous fungus Fusarium venenatum, grown on glucose.","originType":"fungal fermentation","vegan":"check","tier":"context","why":"Naturally high in fibre and low in saturated fat — it comes out well in UK nutritional comparisons against both meat and other meat alternatives. The real flag is allergy: mycoprotein causes genuine IgE-mediated allergic reactions in a small number of people, and it is NOT one of the 14 declarable UK allergens. Non-vegan versions contain egg albumen.","adi":"Not applicable","uk":"Permitted; egg in standard (non-vegan) versions is declarable","refs":[]},{"code":"—","name":"Palm oil / palm fat","aka":["palm oil","palm fat","palm kernel oil","palm stearin","vegetable oil (palm)","sustainable palm oil","rspo palm oil"],"class":"Fat","job":"Solid at room temperature without hydrogenation, cheap, and neutral in flavour — which is why it replaced trans fats across the industry.","origin":"Fruit of the oil palm.","originType":"plant","vegan":"yes","tier":"context","why":"Two separate issues, often conflated. Nutritionally it is about 50% saturated fat, so it raises LDL cholesterol relative to unsaturated oils — a real but ordinary concern. Refining it at high temperature also generates 3-MCPD esters and glycidyl esters, contaminants EFSA has flagged, with limits now set in EU/GB law and levels reduced by industry. The deforestation issue is environmental rather than a health flag. Note it is often hidden as 'vegetable oil' or 'vegetable fat' with the source in brackets.","adi":"Not applicable; contaminant limits set for 3-MCPD and glycidyl esters","uk":"Permitted; source of vegetable oil must be specified","refs":[]},{"code":"—","name":"Hydrogenated / partially hydrogenated vegetable oil","aka":["hydrogenated vegetable oil","partially hydrogenated vegetable oil","hydrogenated fat","partially hydrogenated"],"class":"Fat","job":"Liquid oil hardened by adding hydrogen, to make it solid and shelf-stable.","origin":"Vegetable oil, chemically hydrogenated.","originType":"plant, chemically modified","vegan":"yes","tier":"exceeds","why":"PARTIALLY hydrogenated oil is the industrial source of trans fats, the one dietary fat with an unambiguous, large and well-established effect on heart disease. The EU and GB capped industrial trans fat at 2 g per 100 g of fat from 2021, and UK levels are now very low, but if you see 'partially hydrogenated' on a label — especially on an import — that is the strongest single red flag on this list. FULLY hydrogenated oil contains essentially no trans fat and is a different, much less concerning thing.","adi":"Legal limit: 2 g industrial trans fat per 100 g fat","uk":"Capped by law in GB and NI since April 2021","refs":[]},{"code":"—","name":"Iron, niacin and thiamin added to white flour","aka":["iron","niacin","thiamin","thiamine","nicotinamide","nicotinic acid","ferrous sulphate"],"class":"Mandatory fortification","job":"Not the manufacturer's choice. UK law requires white and brown wheat flour to have calcium, iron, niacin and thiamin added back, a public-health measure dating from the Second World War.","origin":"Mineral and synthesised vitamins.","originType":"mineral / synthetic","vegan":"yes","tier":"settled","why":"This is the single most common 'scary chemical list' on a British label, and it is a legal requirement rather than a formulation choice. Wholemeal flour is exempt. If a bread label lists calcium carbonate, iron, niacin and thiamin, that tells you nothing bad about the product. Folic acid joins the list from 13 December 2026 under the 2024 amendment to the regulations, to reduce neural tube defects in pregnancy.","adi":"Not applicable","uk":"Required by the Bread and Flour Regulations 1998; folic acid added by the 2024 amendment, in force from December 2026","refs":[{"t":"UK Bread and Flour Regulations guidance","u":"https://www.gov.uk/government/consultations/bread-and-flour-regulations-1998-proposed-amendments"}]},{"code":"E920","name":"L-cysteine","aka":["l-cysteine","cysteine","e 920","l-cysteine hydrochloride"],"class":"Flour treatment agent","job":"Relaxes gluten so industrial dough can be moulded fast — common in burger buns, bagels, pizza bases and some pastries.","origin":"Historically extracted from duck feathers, hog hair and human hair. Today mostly produced by bacterial fermentation, but the label does not say which.","originType":"variable — fermentation (usual) or animal keratin","vegan":"check","tier":"context","why":"No safety concern. It is on this list because the origin question is real and unresolvable from the label — one of the more surprising entries for anyone eating plant-based.","adi":"No numerical ADI","uk":"Permitted in GB and NI","refs":[]},{"code":"E422","name":"Glycerol (glycerine)","aka":["glycerol","glycerine","glycerin","e 422","vegetable glycerine"],"class":"Humectant","job":"Holds moisture — keeps cereal bars chewy and icing soft.","origin":"By-product of soap and biodiesel manufacture, or of fat splitting. Can be from plant oils or animal fats; 'vegetable glycerine' specifies the former.","originType":"variable — plant oil or animal fat","vegan":"check","tier":"context","why":"Metabolised as a normal component of fat; no safety concern at food levels. Flagged for origin ambiguity only. One genuine exception: glycerol slush ice drinks have caused illness in young children, and in July 2025 the FSA advised they should not be given to children under 7, with 7-to-10-year-olds limited to one 350 ml drink a day. That is a specific product issue, not a general one.","adi":"No numerical ADI","uk":"Permitted in GB and NI","refs":[]},{"code":"E420","name":"Sorbitol and other polyols (E420-E421, E953, E965-E967)","aka":["sorbitol","mannitol","isomalt","maltitol","xylitol","lactitol","polyols","e 420","e 421","e 953","e 965","e 966","e 967"],"class":"Sweetener / humectant","job":"Bulk sweeteners that are only partly absorbed, used in sugar-free sweets, chewing gum and 'diabetic' products.","origin":"Made by hydrogenating sugars from starch. Xylitol comes from birch or corn xylan.","originType":"plant sugar, chemically modified","vegan":"yes","tier":"context","why":"The flag is gastrointestinal, not toxicological: unabsorbed polyols ferment in the colon and cause bloating and diarrhoea, which is why products must carry 'excessive consumption may
